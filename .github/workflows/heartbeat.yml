# Manual-only (DEVLOG #21). This was the backup scheduler (RED-TEAM P9), but a
# cloud runner is a SECOND WRITER with an EMPTY store: data/thetadesk.sqlite is
# not committed, so every cloud tick would see the broker's positions as
# unknown (integrity breach) and, on an empty account, could trade a book the
# local agent knows nothing about — then push journal commits that diverge
# from the local chain. The local Task Scheduler is the only heartbeat; the
# tick lock covers overlapping runs there.
name: theta-desk-heartbeat
on:
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: tick
        run: python -m thetadesk.main tick
        env:
          APCA_API_BASE_URL: https://paper-api.alpaca.markets
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
      - name: persist journal + snapshots
        run: |
          git config user.name "theta-desk-bot"
          git config user.email "bot@theta-desk.local"
          git add data/journal data/snapshots || true
          git diff --cached --quiet || git commit -m "journal: heartbeat $(date -u +%FT%TZ)"
          git push
