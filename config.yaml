# THETA DESK configuration — parameters per RED-TEAM patch list.
# Every number here is a claim the reconciler can check against the journal.

meta:
  strategy_name: theta-desk
  hackathon_deadline_utc: "2026-09-04T15:00:00Z"
  # Judging continues after the deadline; all horizons extend 14 days past it.
  judging_horizon_utc: "2026-09-18T20:00:00Z"

universe:
  underlyings: [SPY, QQQ, IWM]
  primary: SPY

expiry:
  # Gate #3 (patched): every leg expires on/after this date. Sep 18 monthly.
  min_expiry: "2026-09-18"
  target_expiry: "2026-09-18"
  calendar_back_expiry: "2026-10-16"
  # DEVLOG #28: post-submission mode. From roll_after the selector targets
  # roll_target (min_entry_dte would otherwise stop all Sep 18 entries on
  # Sep 8 and the account would sit idle for the last week of judging).
  # Open Sep 18 legs keep being quoted, marked and managed: the tick fetches
  # the chain for every expiry present in the book.
  roll_after: "2026-09-08"
  roll_target: "2026-10-16"

structures:
  default: iron_condor          # RED-TEAM P1: condor = 2x theta per unit of worst case
  condor:
    short_put_delta: 0.17
    short_call_delta: 0.15
    put_wing_width: 10.0
    call_wing_width: 10.0
    min_credit_frac_of_width: 0.18
    # DEVLOG #17: the neutral branch widens strikes by 4 delta, which
    # structurally collects ~30% less credit; with the base floor it could
    # never fire (SPY $1.27-1.33 / QQQ $1.40 vs $1.80 all of Sep 1). 0.12 sits
    # one spread below the observed band; 0.13 was a coin toss per tick.
    neutral_min_credit_frac_of_width: 0.12
  put_credit_spread:
    short_delta: 0.17
    width: 10.0
    min_credit_frac_of_width: 0.25
  hedge:
    put_delta: 0.05
    budget_frac_equity: 0.006   # <= 0.6% of equity in total premium
  calendar:
    enabled: false              # first on the cut line; both legs must clear min_expiry

risk:
  # RED-TEAM patched values
  per_structure_max_loss_frac: 0.0125     # gate #7: 1.25% of equity
  # DEVLOG #32: the base was the START of the envelope, not its edge — the
  # earned-budget rule was always meant to walk it up to the cap. At 6% the
  # desk sat at 2.5% of equity with three condors and $69/day of theta on the
  # table it was not allowed to reach. The base moves to 7.5%; the CAP DOES
  # NOT MOVE. The worst case the desk can ever hold is still 8% of equity,
  # exactly the number the strategy was designed around.
  portfolio_worst_case_frac: 0.075        # gate #8 base: 7.5% of equity
  portfolio_worst_case_cap: 0.08          # earned-budget ceiling — UNCHANGED
  earned_budget_gain_mult: 0.5            # budget = base + 0.5 * realized_gains (capped)
  daily_new_risk_frac: 0.035              # gate #9: 3.5% per day (DEVLOG #32:
                                          # 2.5% took three sessions to fill a
                                          # book the portfolio gate would allow
                                          # in two; the ceiling is unchanged, so
                                          # this buys theta-days, not exposure)
  cheap_sleeve_budget_frac: 0.015         # gate #18: total open long-premium debit cap
  cheap_sleeve_budget_cap: 0.025          # gate #18 earned ceiling (base + 0.5x realized)
  drawdown_halt_frac: 0.04                # gate #14: halt new risk (NOT flatten)
  price_grid_low: 0.80                    # payoff grid: spot * [0.80 .. 1.20]
  price_grid_high: 1.20
  price_grid_step: 0.005
  vol_shock_up_rel: 0.50                  # stressed scenario: IV +50% rel on down moves
  risk_free_rate: 0.04

ladder:
  # DEVLOG #36: size is EARNED. The risk.* fractions above are the floor and
  # the rollback (enabled: false = the desk exactly as it traded to Sep 3).
  # A rung is reached by CLOSED core trades with a non-negative realised
  # result, and taken back by drawdown from the high-water mark before gate
  # #14 halts new risk at 4%. Nothing here is read by a model; the tick
  # journals the rung it used as `ladder` before it sizes.
  #
  # Why: 1.25% per structure pinned every entry at ONE contract ($10-wide
  # condor = ~$830 of worst case; a second would need $1,660). Nine
  # structures, nine times qty 1, 4.85% of equity ever at risk. +$598 on
  # $3,165 of closed risk is +18.9% on the risk actually taken.
  enabled: true
  promote_requires_realized_nonneg: true
  demote_one_tier_at_drawdown: 0.020
  demote_to_floor_at_drawdown: 0.035
  tiers:
    - name: explore                        # day one, no record
      min_closed: 0
      per_structure_frac: 0.020            # gate #7
      daily_new_risk_frac: 0.050           # gate #9
      portfolio_worst_case_frac: 0.090     # gate #8 base
      portfolio_worst_case_cap: 0.100      # gate #8 earned ceiling
    - name: establish                      # five resolved trades, net >= 0
      min_closed: 5
      per_structure_frac: 0.030
      daily_new_risk_frac: 0.080
      portfolio_worst_case_frac: 0.135
      portfolio_worst_case_cap: 0.150
    - name: scale                          # fifteen resolved trades, net >= 0
      min_closed: 15
      per_structure_frac: 0.040
      daily_new_risk_frac: 0.100
      portfolio_worst_case_frac: 0.160
      portfolio_worst_case_cap: 0.180

liquidity:
  max_rel_spread: 0.08          # gate #6
  require_two_sided: true       # gate #5
  # gate #19 (DEVLOG #22): median quote age of the 20 nearest-ATM contracts.
  # Live feed shows 0.0m median / 5.3m max across the whole chain in-session.
  max_quote_age_min: 10

timing:
  no_trade_first_min: 15        # gate #10
  no_trade_last_min: 15
  fill_wait_min: 10             # cancel unfilled after this
  reprice_retries: 1
  reprice_credit_haircut: 0.15  # 2nd attempt: accept 15% less credit

management:
  profit_target_frac: 0.35      # gate #12 (patched from 0.50) — credit structures
  debit_profit_target_frac: 0.60  # long-premium structures: take at +60% of debit
  realize_min_frac: 0.25        # realization policy: close best >=25% on idle days
  realize_window_min: 60        # ...but only in the last hour (DEVLOG #24): at the
                                # open "no entries today" is always true
  structure_stop_credit_mult: 2.0   # gate #13 (credit structures only)
  time_stop_dte: 7              # gate #11 (does not apply to legs behind min_expiry horizon)
  min_entry_dte: 10             # gate #3 (DEVLOG #26): no entries the time stop would
                                # close next tick — Sep 18 legs stop being entered Sep 8
  # DEVLOG #30: never hand a gain back, never hold long premium in rich vol.
  trail_arm_frac: 0.20          # trailing stop arms once a structure has shown +20%
  trail_giveback_frac: 0.40     # ...and closes when 40% of that peak has been given back
  regime_exit_long_premium: true  # a core long-premium structure is closed in a 'rich' regime

sizing:
  # DEVLOG #31: these were documentation of hard-coded 0.5s; now they are read.
  disagreement_mult: 0.5        # gate #16 — agents/desk.py DeskView.size_mult (also
                                # applied for a high-severity objection and data_suspect)
  neutral_regime_mult: 0.5      # engine/selector.py neutral branch
  # No event_mode_mult: inside the event window gate #17 refuses new risk
  # outright (a multiplier of 0.0 was never read by anything).

events:
  # Gate #17 (RED-TEAM P2): de-risk before high-class macro releases.
  # 24h so the window covers Thursday's session before Friday-morning NFP
  # (16h started only after Thursday's close — a dead rule, DEVLOG #15).
  derisk_hours_before: 24
  # No derisk_worst_case_frac: nothing ever read it. It promised to shrink the
  # book to 2.5% inside the window, and a key that claims a protection the
  # code does not implement is worse than no key. What the window ACTUALLY
  # does: refuse all new risk (gate #17) and close anything at or above
  # derisk_lock_profit_frac. Forced liquidation at market prices before a
  # print is a strategy change, not a config value — deliberately not added.
  derisk_lock_profit_frac: 0.15   # inside the window: close anything >= +15%
  # DEVLOG #34: event proximity shield. Inside a high-class window, close a
  # core structure whose nearest SHORT strike sits closer to spot than this
  # many expected daily moves (sigma = atm_iv / sqrt(252), the market's own
  # number, not ours). 2.0 = survive a two-sigma event day. Locking winners
  # alone left the losers exposed, which is backwards: a gap hurts the strikes
  # that are near, not the ones that are green.
  event_shield_sigmas: 2.0
  calendar_file: events.yaml

regime:
  # Deterministic VRP signal. LLMs veto/argue; they do not compute.
  rv_lookback_days: 20
  vrp_rich_threshold: 0.60      # score >= -> sell premium (condors)
  vrp_cheap_threshold: 0.40     # score <  -> cheap-vol branch (micro long vega)

llm:
  # DEVLOG #13: hybrid two-tier inference (Anthropic funded 2026-09-01).
  # Deep roles on Claude; frequent/cheap roles on Featherless open models.
  # The analyst/second-opinion pair is now CROSS-PROVIDER (Anthropic vs
  # Featherless/Mistral) — the strongest form of the disagreement signal.
  # DEVLOG #10: Meta-Llama models are HF-gated on Featherless (403) — avoid.
  analyst_provider: anthropic
  analyst_model: "claude-sonnet-5"
  second_provider: featherless
  second_model: "mistralai/Mistral-Small-24B-Instruct-2501"
  vetoer_provider: featherless
  vetoer_model: "Qwen/Qwen2.5-7B-Instruct"
  risk_provider: anthropic
  risk_model: "claude-sonnet-5"
  timeout_s: 45
  # Degraded mode: with no keys the desk falls back to deterministic
  # signals and conservative defaults; every fallback is journaled.

paths:
  db: data/thetadesk.sqlite
  journal_dir: data/journal
  snapshot_dir: data/snapshots
  evidence_dir: data/evidence
