[project]
name = "thetadesk"
version = "0.1.0"
description = "THETA DESK — autonomous options desk on Alpaca (paper trading only)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
