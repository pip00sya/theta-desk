<!doctype html>
<html lang="en" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>panels-d probe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  /* PROBE CHROME ONLY — this file is a harness, not part of the instrument.
     It reproduces column D's real geometry (357px wide, 99/199px rows) so the
     panels are measured at the size they actually ship at. */
  html,body{height:auto;overflow:auto;background:#0B0B0C}
  #probe{display:flex;gap:12px;padding:10px;align-items:flex-start;min-width:760px}
  #stack{display:flex;flex-direction:column;gap:1px;background:#26262A;flex:0 0 357px;width:357px}
  #stack > section{background:#141416;flex:0 0 auto}
  .h1{height:99px} .h2{height:199px}
  #side{flex:1 1 auto;min-width:0;color:#8E8E88;font:11px/1.4 ui-monospace,monospace}
  #report{white-space:pre-wrap;font:10.5px/1.35 ui-monospace,monospace;color:#8E8E88;
          border:1px solid #26262A;padding:8px;max-height:70vh;overflow:auto}
  #bar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  #bar button{font:10px ui-monospace,monospace;color:#F2F2F0;background:#212125;border:1px solid #33333A;padding:2px 6px;cursor:pointer}
  .wide{width:477px}
  h3{color:#F2F2F0;font:11px ui-monospace,monospace;margin:8px 0 4px}
</style>
</head>
<body>

<div id="probe">
  <div id="stack">
    <section class="p h1" id="p-recon" data-panel="recon" data-area="d1">
      <header class="ph"><h2>RECONCILIATION</h2><div class="pc" data-controls></div><div class="pr" data-readout>—</div></header>
      <div class="pb" data-body></div>
      <footer class="pf" data-provenance>broker · book · quotes</footer>
    </section>
    <section class="p h1" id="p-integrity" data-panel="integrity" data-area="d2">
      <header class="ph"><h2>INTEGRITY &amp; CHAIN</h2><div class="pc" data-controls></div><div class="pr" data-readout>—</div></header>
      <div class="pb" data-body></div>
      <footer class="pf" data-provenance>series.integrity</footer>
    </section>
    <section class="p h2" id="p-trades" data-panel="trades" data-area="d3">
      <header class="ph"><h2>CLOSED TRADES</h2><div class="pc" data-controls></div><div class="pr" data-readout>—</div></header>
      <div class="pb" data-body></div>
      <footer class="pf" data-provenance>trades</footer>
    </section>
    <section class="p h2" id="p-deck" data-panel="deck" data-area="d4">
      <header class="ph"><h2>DECK</h2><div class="pc" data-controls></div><div class="pr" data-readout>—</div></header>
      <div class="pb" data-body></div>
      <footer class="pf" data-provenance>positions · manage · params · claims</footer>
    </section>
    <section class="p h2" id="p-inspector" data-panel="inspector" data-area="d5" data-open="1">
      <header class="ph"><h2>INSPECTOR</h2><div class="pc" data-controls></div><div class="pr" data-readout>—</div></header>
      <div class="pb" data-body></div>
      <footer class="pf" data-provenance>selection</footer>
    </section>
  </div>

  <div id="side">
    <div id="bar"></div>
    <h3>SELF TEST</h3>
    <pre id="report">loading data.json …</pre>
  </div>
</div>

<script src="charts.js"></script>
<script src="derive.js"></script>
<script src="panels-d.js"></script>
<script>
/* ---- the probe's stand-in for app.js: S, TD.set, one render pass ---- */
var S = {
  range:'all', axis:'session', cur:null, locked:false, sel:null,
  books:null, base:'nogates', quality:'all', density:'compact', judge:false,
  tab:'decisions', q:'', from:'', to:'', gate:null, kind:null, underlying:null,
  deck:'strikes', solo:null
};
var D = null;
var PANELS = [['recon','p-recon'],['integrity','p-integrity'],['trades','p-trades'],
              ['deck','p-deck'],['inspector','p-inspector']];
var ERRORS = [];

window.TD = {
  set: function (patch) {
    for (var k in patch) S[k] = patch[k];
    renderAll();
  },
  link: function () { return 'probe://view'; },
  drawer: function (obj, label) { window.__LASTDRAWER__ = { label: label, obj: obj }; }
};
TDC.cursor.onLock(function (i, locked) { S.cur = i; S.locked = locked; renderAll(); });

function bodyOf(id) { return document.getElementById(id).querySelector('[data-body]'); }

function renderOne(key, id) {
  try {
    TDP[key](bodyOf(id), D, S);
    return null;
  } catch (e) {
    var msg = key + ': ' + (e && e.stack ? e.stack.split('\n').slice(0,3).join(' | ') : e);
    ERRORS.push(msg);
    return msg;
  }
}
function renderAll() { PANELS.forEach(function (p) { renderOne(p[0], p[1]); }); }

/* ---- the self test ---- */
function probeOf(id) {
  var sec = document.getElementById(id);
  var b = sec.querySelector('[data-body]');
  return {
    text: (b.textContent || '').replace(/\s+/g, ' ').trim(),
    len: (b.textContent || '').length,
    svg: b.querySelectorAll('svg').length,
    notpub: b.querySelectorAll('.notpub').length,
    rows: b.querySelectorAll('.row,tr,.tile,.cell,.step,.node,dd').length,
    readout: sec.querySelector('[data-readout]').textContent.trim(),
    prov: sec.querySelector('[data-provenance]').textContent.trim(),
    ctrls: sec.querySelector('[data-controls]').querySelectorAll('button').length,
    scrollY: b.scrollHeight - b.clientHeight,
    ok: true
  };
}
function line(o) {
  return ' rows=' + o.rows + ' svg=' + o.svg + ' notpub=' + o.notpub +
         ' ctl=' + o.ctrls + ' over=' + o.scrollY + 'px\n    RO: ' + o.readout +
         '\n    PF: ' + o.prov.slice(0, 130);
}

function runAll() {
  var out = [];
  function step(title, fn) {
    var before = ERRORS.length;
    try { fn(); } catch (e) { ERRORS.push(title + ': ' + e); }
    var err = ERRORS.length > before ? '  ***ERROR***' : '';
    out.push(title + err);
  }

  out.push('=== D1 RECONCILIATION ===');
  ['now','history'].forEach(function (m) {
    step('D1 ' + m, function () {
      document.getElementById('p-recon').setAttribute('data-v-mode', m);
      document.getElementById('p-recon').setAttribute('data-v-legs', '0');
      renderOne('recon','p-recon');
      out.push(line(probeOf('p-recon')));
    });
  });
  step('D1 per-leg', function () {
    document.getElementById('p-recon').setAttribute('data-v-legs', '1');
    renderOne('recon','p-recon');
    out.push(line(probeOf('p-recon')));
    document.getElementById('p-recon').setAttribute('data-v-legs', '0');
    document.getElementById('p-recon').setAttribute('data-v-mode', 'now');
    renderOne('recon','p-recon');
  });

  out.push('=== D2 INTEGRITY ===');
  step('D2', function () {
    renderOne('integrity','p-integrity');
    var o = probeOf('p-integrity');
    out.push(line(o));
    var cells = document.querySelectorAll('#p-integrity .strip .cell');
    var okN = document.querySelectorAll('#p-integrity .strip .cell.ok').length;
    var badN = document.querySelectorAll('#p-integrity .strip .cell.bad').length;
    out.push('    cells=' + cells.length + ' ok=' + okN + ' bad=' + badN +
      ' greenPaint=' + (cells.length ? getComputedStyle(document.querySelector('#p-integrity .strip .cell.ok')).backgroundColor : 'n/a') +
      ' badPaint=' + (badN ? getComputedStyle(document.querySelector('#p-integrity .strip .cell.bad')).backgroundColor : 'n/a'));
  });

  out.push('=== D3 CLOSED TRADES ===');
  ['wf','r','hours'].forEach(function (m) {
    step('D3 ' + m, function () {
      document.getElementById('p-trades').setAttribute('data-v-mode', m);
      renderOne('trades','p-trades');
      out.push(line(probeOf('p-trades')));
    });
  });

  out.push('=== D4 DECK ===');
  ['strikes','paths','funnel','params','claims'].forEach(function (v) {
    step('D4 ' + v, function () {
      S.deck = v;
      renderOne('deck','p-deck');
      out.push(line(probeOf('p-deck')));
    });
  });
  step('D4 strikes/DTE', function () {
    S.deck = 'strikes';
    document.getElementById('p-deck').setAttribute('data-v-sub','dte');
    renderOne('deck','p-deck');
    out.push(line(probeOf('p-deck')));
    document.getElementById('p-deck').setAttribute('data-v-sub','strikes');
  });
  step('D4 params search "risk"', function () {
    S.deck = 'params';
    renderOne('deck','p-deck');
    var inp = document.querySelector('#p-deck [data-q]');
    inp.value = 'risk';
    inp.focus();
    renderOne('deck','p-deck');
    var still = document.activeElement === document.querySelector('#p-deck [data-q]');
    out.push(line(probeOf('p-deck')) + '\n    focus kept across re-render: ' + still +
      ' · value kept: ' + (document.querySelector('#p-deck [data-q]').value === 'risk'));
    inp.value = '';
    renderOne('deck','p-deck');
  });

  out.push('=== D5 INSPECTOR — every selectable type ===');
  var cases = [
    ['(none)', null],
    ['tick', { type:'tick', id: D.spine.n - 1 }],
    ['structure', { type:'structure', id: D.structures.all[0].id }],
    ['structure closed', { type:'structure', id: D.structures.closed[0].id }],
    ['structure unfilled', { type:'structure', id: D.structures.unfilled[0].id }],
    ['trade', { type:'trade', id: D.trades.rows[0].id }],
    ['gateeval', { type:'gateeval', id: 0 }],
    ['gateeval refused', { type:'gateeval', id: (function(){ for(var i=0;i<D.gates.evals.length;i++) if(!D.gates.evals[i].passed) return i; return 0; })() }],
    ['gate bound', { type:'gate', id: D.gates.everBound[0] }],
    ['gate never bound', { type:'gate', id: D.gates.neverBound[0] }],
    ['refusal', { type:'refusal', id: 'ref:3' }],
    ['refusal int', { type:'refusal', id: 10 }],
    ['decision', { type:'decision', id: 'dec:5' }],
    ['decision with payload', { type:'decision', id: (function(){ var b=D.blotter.by.decisions; for(var i=0;i<b.length;i++) if(b[i].d) return b[i].key; return 'dec:0'; })() }],
    ['meeting', { type:'meeting', id: 0 }],
    ['meeting veto', { type:'meeting', id: D.desk.vetoRows.length ? D.desk.vetoRows[0].k : 0 }],
    ['integrity ok', { type:'integrity', id: 0 }],
    ['integrity fail', { type:'integrity', id: D.integrity.failures.length ? D.integrity.failures[0].k : 0 }],
    ['claim', { type:'claim', id: '01' }],
    ['claim unverifiable', { type:'claim', id: '12' }],
    ['param', { type:'param', id: 'risk.per_structure_max_loss_frac' }],
    ['leg', { type:'leg', id: D.structures.open[0].legs[0].symbol }],
    ['day', { type:'day', id: D.days.rows[0].day }],
    ['underlying SPY', { type:'underlying', id: 'SPY' }],
    ['underlying uncovered', { type:'underlying', id: (function(){ for(var i=0;i<D.tree.universe.length;i++) if(!D.tree.universe[i].covered) return D.tree.universe[i].sym; return 'SPY'; })() }],
    ['book real', { type:'book', id: 'real' }],
    ['book shadow', { type:'book', id: 'shadow_nogates' }],
    ['brokercheck', { type:'brokercheck', id: 1 }],
    ['bogus type', { type:'wombat', id: 'x' }],
    ['bogus id', { type:'structure', id: 'deadbeef' }]
  ];
  cases.forEach(function (c) {
    step('D5 ' + c[0], function () {
      S.sel = c[1];
      renderOne('inspector','p-inspector');
      var o = probeOf('p-inspector');
      out.push(line(o));
      if (o.len < 40) out.push('    *** EMPTY BODY ***');
    });
  });

  /* idempotence: ten renders must leave one svg per chart host */
  out.push('=== IDEMPOTENCE ===');
  step('10x re-render', function () {
    S.sel = null; S.deck = 'strikes';
    for (var i = 0; i < 10; i++) renderAll();
    var c1 = document.querySelectorAll('#p-trades [data-chart] svg').length;
    var c2 = document.querySelectorAll('#p-deck [data-chart] svg').length;
    var c3 = document.querySelectorAll('#p-recon [data-body] > *').length;
    var c4 = document.querySelectorAll('#p-integrity .strip').length;
    out.push('    trades svg=' + c1 + ' deck svg=' + c2 + ' recon children=' + c3 + ' strips=' + c4 +
             ' (expect 1 / 1 / 1 / 1)');
  });

  out.push('=== PAGE GEOMETRY ===');
  PANELS.forEach(function (p) {
    var b = document.getElementById(p[1]).querySelector('[data-body]');
    out.push('    ' + p[1] + ' body ' + b.clientWidth + 'x' + b.clientHeight +
             ' content ' + b.scrollWidth + 'x' + b.scrollHeight +
             (b.scrollWidth > b.clientWidth ? '  H-SCROLL' : '') +
             (b.scrollHeight > b.clientHeight ? '  v-scroll ' + (b.scrollHeight - b.clientHeight) + 'px' : ''));
  });

  out.push('=== ERRORS: ' + ERRORS.length + ' ===');
  ERRORS.forEach(function (e) { out.push('  ' + e); });

  var txt = out.join('\n');
  document.getElementById('report').textContent = txt;
  window.__REPORT__ = txt;
  window.__ERRORS__ = ERRORS;
  return txt;
}

function bar() {
  var b = document.getElementById('bar');
  [['deck strikes',function(){TD.set({deck:'strikes'});}],
   ['deck paths',function(){TD.set({deck:'paths'});}],
   ['deck funnel',function(){TD.set({deck:'funnel'});}],
   ['deck params',function(){TD.set({deck:'params'});}],
   ['deck claims',function(){TD.set({deck:'claims'});}],
   ['sel tick',function(){TD.set({sel:{type:'tick',id:D.spine.n-1}});}],
   ['sel structure',function(){TD.set({sel:{type:'structure',id:D.structures.closed[0].id}});}],
   ['sel gateeval',function(){TD.set({sel:{type:'gateeval',id:0}});}],
   ['clear sel',function(){TD.set({sel:null});}],
   ['judge',function(){TD.set({judge:!S.judge});document.documentElement.setAttribute('data-judge',S.judge?'1':'0');}],
   ['RUN SELF TEST',function(){runAll();}]
  ].forEach(function (x) {
    var btn = document.createElement('button');
    btn.textContent = x[0];
    btn.addEventListener('click', x[1]);
    b.appendChild(btn);
  });
}

fetch('data.json?ts=' + Date.now(), { cache:'no-store' })
  .then(function (r) { return r.json(); })
  .then(function (j) {
    D = TDD.derive(j);
    window.__D__ = D;
    bar();
    renderAll();
    runAll();
  })
  .catch(function (e) {
    document.getElementById('report').textContent =
      'FAILED to load data.json: ' + e + '\nServe this directory: python -m http.server 8778 --directory dashboard/web';
  });
</script>
</body>
</html>
