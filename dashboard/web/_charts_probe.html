<!doctype html>
<html lang="en" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TDC · chart kernel probe</title>
<!--
  Standalone bench for dashboard/web/charts.js.  It is NOT part of the page:
  app.py only ever inlines index.html, and nothing here is imported by the
  instrument.  Its job is to let a human check the kernel on its own, against
  real slices of data.json, before any panel is written.

  This is the one page in the project that scrolls: it is a gallery of every
  mark, not the fixed-viewport instrument.

  Serve it — fetch() cannot read data.json over file://:
      python -m http.server 8765 --directory dashboard/web
      http://localhost:8765/_charts_probe.html
-->
<style>
/* The tokens of §3.1.  The probe carries its own copy because styles.css is
   another agent's file and this page must stand alone; TDC.C reads these the
   same way it will read the real stylesheet. */
:root{
  --ground:#0B0B0C; --surface:#141416; --surface2:#1A1A1D; --raised:#212125;
  --rule:#26262A; --rule-hi:#33333A;
  --ink:#F2F2F0; --soft:#8E8E88; --faint:#5C5C58;
  --gate:#FFD400; --sel:#A98BFF; --breach:#FF5A47; --ok:#2FD98F;
  --bk-real:#F2F2F0; --bk-nogates:#5B9DFF; --bk-nohedge:#8E8E88; --bk-naive:#6E6A5A;
  --iv:#FFD400; --rv:#7FA6C9; --premium:rgba(255,212,0,.14);
  --mono:"IBM Plex Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font:11.5px/1.45 var(--mono);font-variant-numeric:tabular-nums;padding:0 0 60px}
h1{font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);
   margin:0;padding:12px 14px;border-bottom:1px solid var(--rule);background:var(--surface2);
   position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:baseline}
h1 small{font-weight:400;color:var(--faint);letter-spacing:.06em;text-transform:none}
#grid{display:grid;gap:1px;background:var(--rule);grid-template-columns:repeat(auto-fill,minmax(430px,1fr));
      border-bottom:1px solid var(--rule)}
.card{background:var(--surface);display:flex;flex-direction:column;min-width:0}
.card>h2{font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
     margin:0;padding:7px 10px;background:var(--surface2);border-bottom:1px solid var(--rule);
     display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card>h2 b{color:var(--soft);font-weight:500}
.card>h2 em{font-style:normal;color:var(--faint);font-size:9.5px;letter-spacing:0;text-transform:none}
.plot{height:190px;min-height:0}
.plot.sm{height:120px}
.plot.tall{height:250px}
.plot.scroll{overflow-x:auto;overflow-y:hidden}
.pad{padding:8px 10px}
.foot{padding:5px 10px;border-top:1px solid var(--rule);color:var(--faint);font-size:10.5px}
.wide{grid-column:1/-1}
table{border-collapse:collapse;width:100%;font-size:11px}
td,th{padding:2px 8px 2px 0;text-align:left;vertical-align:baseline;white-space:nowrap}
th{color:var(--faint);font-weight:500;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)} .bad{color:var(--breach)} .soft{color:var(--soft)} .faint{color:var(--faint)}
.id{color:var(--sel)}
.legend{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px}
.legend .lg{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 6px;background:none;
  border:1px solid var(--rule);color:var(--soft);font:11px var(--mono);cursor:pointer}
.legend .lg[data-on="0"]{opacity:.4}
.legend .lg.struck .lb{text-decoration:line-through}
.legend .lg .ln{color:var(--faint)}
button.b{height:18px;padding:0 8px;background:none;border:1px solid var(--rule);color:var(--soft);
  font:11px var(--mono);cursor:pointer}
button.b:hover{border-color:var(--rule-hi);color:var(--ink)}
:focus-visible{outline:1px solid var(--sel);outline-offset:1px}
[data-dim="1"]{opacity:.34}
.sparkrow{display:grid;grid-template-columns:88px 1fr 84px;gap:8px;align-items:center;padding:2px 10px}
.sparkrow .lab{color:var(--faint);font-size:10.5px}
.sparkrow .val{text-align:right}
.sparkrow .sp{height:16px}
.tdc-tip{background:var(--surface2);color:var(--ink);border:1px solid var(--rule-hi);
  padding:4px 6px;font:11px/1.35 var(--mono);max-width:280px}
#cursorRead{color:var(--gate)}
.notpub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:1px dashed var(--rule);color:var(--faint);font-size:10.5px;padding:10px;margin:8px 10px;text-align:center}
.notpub b{color:var(--soft);font-weight:500}
#err{padding:14px;color:var(--breach);white-space:pre-wrap}
</style>
</head>
<body>

<h1>TDC · CHART KERNEL PROBE
  <small id="meta">loading data.json…</small>
  <small id="cursorRead">cursor —</small>
</h1>

<div id="err" hidden></div>
<div id="grid"></div>

<script src="charts.js"></script>
<script>
(function () {
'use strict';
var C = TDC.C, F = TDC.fmt, G = document.getElementById('grid');

/* ---- card helper ------------------------------------------------------- */
function card(title, note, cls) {
  var d = document.createElement('div');
  d.className = 'card' + (cls ? ' ' + cls : '');
  d.innerHTML = '<h2><b>' + title + '</b><em>' + (note || '') + '</em></h2>';
  G.appendChild(d);
  return d;
}
function body(c, cls) {
  var d = document.createElement('div');
  d.className = cls || 'plot';
  c.appendChild(d);
  return d;
}
function foot(c, html) {
  var d = document.createElement('div');
  d.className = 'foot';
  d.innerHTML = html;
  c.appendChild(d);
  return d;
}

/* ---- boot -------------------------------------------------------------- */
function load() {
  if (window.__DATA__) return Promise.resolve(window.__DATA__);
  return fetch('data.json?ts=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('data.json → HTTP ' + r.status);
    return r.json();
  });
}
load().then(run).catch(function (e) {
  var el = document.getElementById('err');
  el.hidden = false;
  el.textContent = 'Could not load data.json: ' + (e && e.message ? e.message : e) +
    '\n\nfetch() cannot read a sibling file over file://.  Serve the folder:\n' +
    '  python -m http.server 8765 --directory dashboard/web\n' +
    '  http://localhost:8765/_charts_probe.html';
});

/* ======================================================================== */
function run(D) {
  var S = D.series, IX = TDC.index.build(D), st = IX.stats();
  var i0 = 0, i1 = IX.n - 1;
  var books = ['real', 'shadow_nogates', 'shadow_nohedge', 'baseline_naive'];
  var bookColor = { real: C.bkReal, shadow_nogates: C.bkNogates, shadow_nohedge: C.bkNohedge, baseline_naive: C.bkNaive };
  var bound = {};
  books.forEach(function (k) { bound[k] = TDC.bind(S.books[k] || [], IX, 'v'); });

  document.getElementById('meta').textContent =
    D.commit + ' · ' + st.stamps + ' stamps → ' + st.ticks + ' ticks · ' + st.days +
    ' sessions · max cluster ' + st.maxSpan + 's, median ' + st.medianSpan + 's';

  /* one cursor readout for the whole page, proving the bus */
  TDC.cursor.on(function (i, s) {
    var el = document.getElementById('cursorRead');
    if (i === null || i === undefined) { el.textContent = 'cursor —'; return; }
    var real = null;
    for (var j = 0; j < bound.real.length; j++) if (bound.real[j].i === i) real = bound.real[j].v;
    el.textContent = 'cursor ' + i + ' · ' + IX.label(i, 'abs') +
      (real === null ? '' : (' · real ' + F.usd(real))) + (s.locked ? ' · LOCKED' : '');
  });
  TDC.cursor.onLock(function (i, locked) {
    /* app.js will route this into TD.set({cur,locked}); here we only prove it fires */
    console.log('[probe] cursor.onLock', i, locked);
  });

  /* ---------------------------------------------------------------- smoke */
  (function () {
    var c = card('0 · smoke test', '§2.3 — nothing else may start until this passes', 'wide');
    var r = TDC.smoke(D), h = '<table><tr><th>check</th><th>ok</th><th>detail</th></tr>';
    r.checks.forEach(function (k) {
      h += '<tr><td>' + k.name + '</td><td class="' + (k.ok ? 'ok' : 'bad') + '">' +
           (k.ok ? 'PASS' : 'FAIL') + '</td><td class="soft">' + TDC.esc(k.detail) + '</td></tr>';
    });
    h += '</table>';
    var p = body(c, 'pad'); p.innerHTML = h;
    foot(c, 'TDC.smoke(data) → ' + (r.ok ? '<span class="ok">ALL PASS</span>' : '<span class="bad">FAILURE</span>') +
            ' · TDC v' + TDC.version);
  })();

  /* ------------------------------------------------------- formatters §6.1 */
  (function () {
    var c = card('1 · formatters', '§6.1 — every call against a real field');
    var rows = [
      ['usd(book.pnl)', F.usd(D.book.pnl), 'book.pnl'],
      ['usd(nogates final)', F.usd(bound.shadow_nogates[bound.shadow_nogates.length - 1].v), 'series.books.shadow_nogates'],
      ['usd0(broker.equity)', F.usd0(D.broker.equity), 'broker.equity'],
      ['money(limits.portfolio)', F.money(D.limits.portfolio), 'limits.portfolio'],
      ['pct(26/57)', F.pct(26 / 57), 'derived'],
      ['pctRaw(book.pnl_pct)', F.pctRaw(D.book.pnl_pct), 'book.pnl_pct'],
      ['vol(signals.atm_iv)', F.vol(D.signals.atm_iv), 'signals.atm_iv'],
      ['vol(signals.rv20)', F.vol(D.signals.rv20), 'signals.rv20'],
      ['ratio(iv/rv)', F.ratio(D.signals.atm_iv / D.signals.rv20), 'derived'],
      ['num(signals.spot,2)', F.num(D.signals.spot, 2), 'signals.spot'],
      ['greek(greeks.delta)', F.greek(D.greeks.delta), 'greeks.delta'],
      ['greek(greeks.theta)', F.greek(D.greeks.theta), 'greeks.theta'],
      ['greek(greeks.vega)', F.greek(D.greeks.vega), 'greeks.vega'],
      ['count(verification.journal_entries)', F.count(D.verification.journal_entries), 'verification.journal_entries'],
      ['rate(26,57)', F.rate(26, 57), 'derived'],
      ['ts(last_tick_utc,"full")', F.ts(D.last_tick_utc, 'full'), 'last_tick_utc'],
      ['ts(…,"dow")', F.ts(D.last_tick_utc, 'dow'), 'last_tick_utc'],
      ['ts(…,"hms")', F.ts(D.book.marked_at, 'hms'), 'book.marked_at'],
      ['ts(…,"md")', F.ts(D.book.marked_at, 'md'), 'book.marked_at'],
      ['age(last_tick_utc)', F.age(D.last_tick_utc), 'last_tick_utc'],
      ['dur(trades[0].hours)', F.dur(D.trades[0].hours), 'trades[0].hours'],
      ['id(trades[0].id)', F.id(D.trades[0].id), 'trades[0].id'],
      ['usd(null)', F.usd(null), 'the missing-value glyph']
    ];
    var h = '<table><tr><th>call</th><th>result</th><th>source</th></tr>';
    rows.forEach(function (r) {
      h += '<tr><td class="faint">' + TDC.esc(r[0]) + '</td><td class="n">' + r[1] +
           '</td><td class="soft">' + TDC.esc(r[2]) + '</td></tr>';
    });
    var p = body(c, 'pad'); p.innerHTML = h + '</table>';
    foot(c, 'U+2212 for every minus · tabular figures · null → “' + F.DASH + '”, never 0');
  })();

  /* ------------------------------------------------------ the tick index */
  (function () {
    var c = card('2 · shared tick index', '§6.2 — 300s clustering, ordinal axis');
    var h = '<table><tr><th>session</th><th class="n">i₀</th><th class="n">i₁</th><th class="n">ticks</th>' +
            '<th>first</th><th>last</th></tr>';
    IX.days.forEach(function (d) {
      h += '<tr><td>' + d.day + '</td><td class="n">' + d.i0 + '</td><td class="n">' + d.i1 +
           '</td><td class="n">' + (d.i1 - d.i0 + 1) + '</td><td class="soft">' + IX.label(d.i0, 'hm') +
           '</td><td class="soft">' + IX.label(d.i1, 'hm') + '</td></tr>';
    });
    h += '</table>';
    var probe = [
      ['at(signal[0].t)', IX.at(S.signal[0].t)],
      ['at(books.real[0].t)', IX.at(S.books.real[0].t)],
      ['at(gates[0].t)', IX.at(S.gates[0].t)],
      ['at("2026-08-30T12:00:00") — a closed Sunday', IX.at('2026-08-30T12:00:00')],
      ['near("2026-08-30T12:00:00")', IX.near('2026-08-30T12:00:00')],
      ['slice("1d")', IX.slice('1d').join('…')],
      ['slice("3d")', IX.slice('3d').join('…')],
      ['slice("all")', IX.slice('all').join('…')],
      ['dayBreaks', IX.dayBreaks.join(' ')]
    ];
    h += '<table style="margin-top:8px">';
    probe.forEach(function (p2) {
      h += '<tr><td class="faint">' + TDC.esc(p2[0]) + '</td><td class="n">' + p2[1] + '</td></tr>';
    });
    var p = body(c, 'pad'); p.innerHTML = h + '</table>';
    foot(c, st.stamps + ' unique stamps from 14 series → ' + st.ticks + ' clusters · ' +
      'signal ' + S.signal.length + ' · books ' + books.map(function (k) { return (S.books[k] || []).length; }).join('/') +
      ' · gates ' + S.gates.length + ' · desk ' + S.desk.length + ' — five denominators, not interchangeable');
  })();

  /* ------------------------------------- 3 · line + axes + cursor + brush */
  var brushRange = null;
  (function () {
    var c = card('3 · line · axisX · axisY · cursor · brush', 'series.books.real — hover, click to lock, drag to brush', 'wide');
    var host = body(c, 'plot tall');
    var lg = document.createElement('div'); lg.className = 'legend'; c.appendChild(lg);
    var shown = { real: 1, shadow_nogates: 1, shadow_nohedge: 1, baseline_naive: 1 };

    function draw() {
      TDC.mount(host, {
        pad: { t: 10, r: 46, b: 20, l: 58 },
        draw: function (x) {
          x.setIndex(IX);
          var r = brushRange || [i0, i1];
          var xs = x.setX(TDC.scaleTick({ index: IX, mode: 'session', range: [0, x.iw], i0: r[0], i1: r[1] }));
          var vis = books.filter(function (k) { return shown[k]; })
                         .map(function (k) { return bound[k].filter(function (p) { return xs.visible(p.i); }); });
          var ext = TDC.extent.apply(null, vis) || [0, 1];
          var ys = x.setY(TDC.scaleLinear({ domain: ext, range: [x.ih, 0], ticks: 5, zero: true }));
          TDC.axisY(x, { format: F.usd0, ticks: 5, side: 'left', title: 'P&L' });
          TDC.axisX(x, { index: IX, mode: 'session' });
          books.forEach(function (k) {
            if (!shown[k]) return;
            TDC.line(x, {
              pts: bound[k], color: bookColor[k], key: k,
              width: k === 'real' ? 1.5 : 1.1, dot: k === 'real' ? 'last' : 'none',
              dash: k === 'baseline_naive' ? '2 2' : null
            });
          });
          TDC.eventLane(x, {
            marks: TDC.bind(S.derisk || [], IX, function () { return 1; }).map(function (p) {
              return { i: p.i, kind: 'derisk', title: 'DERISK · ' + p.row.reason, color: C.gate };
            }),
            glyph: 'band', y: 0, h: x.ih, opacity: 0.07, layer: 'bg'
          });
          TDC.cursorOverlay(x, {
            valueAt: function (i) {
              for (var j = 0; j < bound.real.length; j++) if (bound.real[j].i === i) return bound.real[j].v;
              return null;
            },
            chip: function (i) { return IX.label(i, 'abs'); }
          });
          TDC.hitline(x, {
            index: IX, id: 'probe-equity',
            onBrush: function (r2) { brushRange = r2; draw(); }
          });
        }
      });
      TDC.legend(lg, {
        items: books.map(function (k) {
          var b = bound[k], last = b.length ? b[b.length - 1].v : null;
          return {
            key: k, label: k, color: bookColor[k], on: !!shown[k],
            note: F.usd(last, 0),
            struck: k !== 'real' && sameAsReal(k),
            title: k === 'real' ? 'the traded book' : 'counterfactual — shares the real book’s entries'
          };
        }),
        onToggle: function (k) { shown[k] = !shown[k]; draw(); }
      });
    }
    function sameAsReal(k) {
      var a = bound.real, b = bound[k];
      if (a.length !== b.length) return false;
      for (var j = 0; j < a.length; j++) if (Math.abs(a[j].v - b[j].v) > 1e-9) return false;
      return true;
    }
    draw();
    foot(c, 'gaps break the path at every session boundary · derisk bands from series.derisk (' +
      (S.derisk || []).length + ') · double-click the plot to clear the brush');
    host.addEventListener('dblclick', function () { brushRange = null; draw(); });
  })();

  /* ------------------------------------------- 4 · area — the Δ difference */
  (function () {
    var c = card('4 · area — real − shadow, zero-baselined', '§5 B2 lower pane · shadow’s own colour, both signs');
    var host = body(c, 'plot');
    var map = {};
    bound.real.forEach(function (p) { map[p.i] = p.v; });
    var diffs = ['shadow_nogates', 'shadow_nohedge', 'baseline_naive'].map(function (k) {
      return {
        key: k,
        pts: bound[k].filter(function (p) { return map[p.i] !== undefined; })
                     .map(function (p) { return { i: p.i, v: map[p.i] - p.v }; })
      };
    });
    TDC.mount(host, {
      pad: { t: 8, r: 46, b: 20, l: 58 },
      draw: function (x) {
        x.setIndex(IX);
        x.setX(TDC.scaleTick({ index: IX, mode: 'session', range: [0, x.iw] }));
        var ext = TDC.extent.apply(null, diffs.map(function (d) { return d.pts; })) || [0, 1];
        x.setY(TDC.scaleLinear({ domain: [Math.min(ext[0], 0), Math.max(ext[1], 0)], range: [x.ih, 0], ticks: 4 }));
        TDC.axisY(x, { format: F.usd0, ticks: 4 });
        TDC.axisX(x, { index: IX });
        diffs.forEach(function (d) {
          TDC.area(x, { pts: d.pts, baseline: 0, fill: bookColor[d.key], opacity: 0.18, key: d.key, line: true, lineColor: bookColor[d.key] });
        });
        TDC.rule(x, { axis: 'y', value: 0, color: C.faint, dash: null, label: '0', side: 'left' });
        TDC.cursorOverlay(x, { chip: function (i) { return IX.label(i, 'hm'); } });
        TDC.hitline(x, { index: IX, id: 'probe-delta' });
      }
    });
    var lastD = diffs.map(function (d) {
      return d.key.replace('shadow_', '').replace('baseline_', '') + ' ' + F.usd(d.pts[d.pts.length - 1].v);
    }).join(' · ');
    foot(c, 'Δ vs real: ' + lastD + ' — the sign is read from the labelled zero rule, never from hue');
  })();

  /* ---------------------------- 5 · band + step + rules — the thesis shape */
  (function () {
    var c = card('5 · band + step + reference rules', '§5 B3 — brass = implied, steel = realized', 'wide');
    var host = body(c, 'plot tall');
    var iv = TDC.bind(S.signal, IX, 'iv'), rv = TDC.bind(S.signal, IX, 'rv'), vrp = TDC.bind(S.signal, IX, 'vrp');
    var rich = D.params.regime.vrp_rich_threshold, cheap = D.params.regime.vrp_cheap_threshold;
    TDC.mount(host, {
      pad: { t: 10, r: 40, b: 20, l: 52 },
      draw: function (x) {
        x.setIndex(IX);
        var xs = x.setX(TDC.scaleTick({ index: IX, mode: 'session', range: [0, x.iw] }));
        var hTop = Math.round(x.ih * 0.62), hBot = x.ih - hTop - 14;
        var yTop = TDC.scaleLinear({ domain: TDC.extent(iv, rv), range: [hTop, 0], ticks: 3 });
        var yBot = TDC.scaleLinear({ domain: [Math.min(0, TDC.extent(vrp)[0]), Math.max(1, TDC.extent(vrp)[1])], range: [x.ih - 12, hTop + 14], ticks: 2 });
        x.setY(yTop);
        TDC.axisY(x, { scale: yTop, format: F.vol, ticks: 3, title: 'vol' });
        TDC.axisY(x, { scale: yBot, format: function (v) { return F.num(v, 2); }, ticks: 2, gridlines: false });
        TDC.band(x, { upper: iv, lower: rv, fill: C.premium, key: 'premium' });
        TDC.line(x, { pts: iv, color: C.iv, key: 'iv', width: 1.4, y: yTop });
        TDC.line(x, { pts: rv, color: C.rv, key: 'rv', width: 1.2, y: yTop });
        TDC.step(x, { pts: vrp, color: C.soft, key: 'vrp', y: yBot, width: 1.1 });
        TDC.rule(x, { axis: 'y', value: rich, y: yBot, color: C.gate, label: 'rich ' + rich, side: 'right', key: 'p-rich' });
        TDC.rule(x, { axis: 'y', value: cheap, y: yBot, color: C.rv, label: 'cheap ' + cheap, side: 'right', key: 'p-cheap' });
        var last = S.derisk && S.derisk.length ? IX.of(S.derisk[S.derisk.length - 1].t) : null;
        if (last != null) TDC.rule(x, { axis: 'x', value: last, color: C.breach, label: 'derisk', side: 'right', y1: hTop });
        TDC.eventLane(x, {
          marks: TDC.bind(S.refusals || [], IX, function () { return 1; }).map(function (p) {
            return { i: p.i, kind: p.row.kind, title: p.row.kind + ' · ' + p.row.reason, color: C.gate };
          }),
          glyph: 'tick', y: x.ih - 10, h: 10, layer: 'fg'
        });
        TDC.axisX(x, { index: IX });
        TDC.cursorOverlay(x, { chip: function (i) { return IX.label(i, 'abs'); } });
        TDC.hitline(x, { index: IX, id: 'probe-thesis' });
      }
    });
    foot(c, 'iv ' + F.vol(D.signals.atm_iv) + ' · rv ' + F.vol(D.signals.rv20) +
      ' · spread ' + F.sgn((D.signals.atm_iv - D.signals.rv20) * 100, 2) + ' vol pts · ratio ' +
      F.ratio(D.signals.atm_iv / D.signals.rv20) + ' · vrp ' + F.num(D.signals.vrp, 2) +

    var specs = [
      ['money', F.usd0, TDC.extent(bound.real)],
      ['percent', function (v) { return F.pct(v, 0); }, [0, 0.5]],
      ['greeks', function (v) { return F.greek(v, 0); }, TDC.extent(TDC.bind(S.books.real, IX, 'vg'))],
      ['counts', F.int, [0, (D.decisions || []).length]]
    ];
    TDC.mount(host, {
      pad: { t: 16, r: 10, b: 18, l: 8 },
      draw: function (x) {
        var w = x.iw / specs.length;
        specs.forEach(function (s, n) {
          var ys = TDC.scaleLinear({ domain: s[2], range: [x.ih, 0], ticks: 4 });
          TDC.axisY(x, { scale: ys, format: s[1], ticks: 4, x0: n * w + 52, x1: (n + 1) * w - 4 });
          x.add('fg', 'text', { x: n * w + 54, y: -6, fill: C.soft, 'font-size': 9.5 }, s[0]);
        });
      }
    });
    foot(c, 'labels thin to fit the height (one tick per 26px) instead of overlapping');
  })();

  /* ------------------------------------------------------- 20 · exports */
  (function () {
    var c = card('20 · tooltip · dim · CSV', 'the shared behaviours that are not marks');
    var host = body(c, 'pad');
    var b1 = document.createElement('button'); b1.className = 'b'; b1.textContent = '⇩ CSV series.books.real';
    var b2 = document.createElement('button'); b2.className = 'b'; b2.textContent = 'tooltip';
    var b3 = document.createElement('button'); b3.className = 'b'; b3.textContent = 'copy commit';
    var out = document.createElement('div'); out.className = 'soft'; out.style.marginTop = '8px';
    host.appendChild(b1); host.appendChild(document.createTextNode(' '));
    host.appendChild(b2); host.appendChild(document.createTextNode(' '));
    host.appendChild(b3); host.appendChild(out);
    b1.addEventListener('click', function () {
      TDC.csv(S.books.real, [
        { key: 't', label: 'utc' }, { key: 'v', label: 'pnl' }, { key: 'r', label: 'realized' },
        { key: 'u', label: 'unrealized' }, { key: 'eq', label: 'broker_equity' },
        { key: 'd', label: 'delta' }, { key: 'th', label: 'theta' }, { key: 'vg', label: 'vega' }
      ], 'books-real.csv').then(function (r) {
        out.textContent = 'csv: ' + r.rows + ' rows, ' + r.bytes + ' bytes · download ' +
          (r.downloaded ? 'started' : 'blocked') + ' · clipboard ' + (r.copied ? 'written' : 'unavailable');
      });
    });
    b2.addEventListener('mousemove', function (e) {
      TDC.tip.show(e.clientX, e.clientY,
        '<b>' + D.account + '</b><br>broker ' + F.usd0(D.broker.equity) +
        '<br>marked ' + F.usd0(D.book.start + D.book.pnl) +
        '<br><span style="color:' + C.faint + '">no fact lives only in a tooltip</span>');
    });
    b2.addEventListener('mouseleave', function () { TDC.tip.hide(); });
    b3.addEventListener('click', function () {
      TDC.copy(D.commit).then(function (ok) { out.textContent = ok ? ('copied ' + D.commit) : 'clipboard unavailable'; });
    });
    foot(c, 'a download inside a sandboxed component iframe is unreliable, so the clipboard is the guarantee, not the fallback');
  })();

  /* --------------------------------------------------- 21 · degenerate */
  (function () {
    var c = card('21 · degenerate series', 'a series that exists but never varies is a labelled scalar, not a flat line');
    var host = body(c, 'pad');
    var gates = S.gates || [], present = {}, fails = {};
    gates.forEach(function (g) { for (var k in (g.r || {})) { present[k] = (present[k] || 0) + 1; if (!g.r[k]) fails[k] = (fails[k] || 0) + 1; } });
    var never = Object.keys(present).filter(function (k) { return !fails[k]; });
    var h = '<table><tr><th>gate</th><th class="n">evaluations</th><th>state</th></tr>';
    never.forEach(function (k) {
      h += '<tr><td>' + k + '</td><td class="n">' + present[k] + '</td><td class="faint">never fired</td></tr>';
    });
    h += '</table>';
    host.innerHTML = h;
    var np = document.createElement('div');
    np.className = 'notpub';
    np.innerHTML = '<b>not published</b><span>series.gates[].data</span><span>tools/site_data.py · _series()</span>';
    c.appendChild(np);
    foot(c, never.length + ' of ' + Object.keys(present).length + ' gates have never bound · the .notpub block is the one empty state, never a spinner and never a zero');
  })();

  console.log('[probe] mounted; TDC.smoke →', TDC.smoke(D));
}
})();
</script>
</body>
</html>
