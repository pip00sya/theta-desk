<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THETA DESK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="console.css">
</head>
<body>

<div id="shell">
  <header id="status"></header>
  <div id="body">
    <aside id="left"></aside>
    <main id="mid"><div class="empty" id="boot">Loading data.json…</div></main>
    <aside id="right"></aside>
  </div>
  <footer id="foot"></footer>
</div>

<div id="trace" role="dialog" aria-modal="true"><div class="sheet" id="trace-sheet"></div></div>

<script>
/* ===========================================================================
   THETA DESK console.

   Every figure is a field of dashboard/web/data.json, regenerated by
   tools/site_data.py on every tick. Nothing here computes a number that is not
   arithmetic on those fields, so no two surfaces in this submission can
   disagree about anything.
   ======================================================================== */
(function () {
'use strict';

/* ---- formatting --------------------------------------------------------- */
var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
function money(v, d) {
  if (v == null || isNaN(v)) return '—';
  d = d == null ? 2 : d;
  return (v < 0 ? '−' : '+') + '$' + Math.abs(v).toLocaleString('en-US',
    { minimumFractionDigits: d, maximumFractionDigits: d });
}
function usd(v, d) {
  if (v == null || isNaN(v)) return '—';
  d = d == null ? 2 : d;
  return '$' + Number(v).toLocaleString('en-US',
    { minimumFractionDigits: d, maximumFractionDigits: d });
}
function pct(v, d) { return v == null ? '—' : (v * 100).toFixed(d == null ? 2 : d); }
function n0(v) { return v == null ? '—' : Number(v).toLocaleString('en-US'); }
function hm(t) { return t ? String(t).slice(11, 16) : '—'; }
function dm(t) { return t ? String(t).slice(5, 10) : '—'; }
function ago(iso) {
  if (!iso) return '';
  var ms = Date.now() - Date.parse(iso.length <= 19 ? iso + 'Z' : iso);
  if (isNaN(ms) || ms < 0) return '';
  var h = Math.floor(ms / 3.6e6), m = Math.round((ms % 3.6e6) / 6e4);
  return h > 0 ? h + 'h ' + m + 'm ago' : m + 'm ago';
}
function nearest(arr, t) {              /* last row at or before t */
  var out = null;
  for (var i = 0; i < arr.length; i++) { if (arr[i].t <= t) out = arr[i]; else break; }
  return out || arr[0] || null;
}

/* ---- one small chart, used three times ---------------------------------- */
/* Ordinal tick index rather than wall-clock: the series are sampled every
   fifteen minutes inside a session and not at all between them, so a time axis
   would be mostly empty gap. One step is one tick. */
function spark(series, opt) {
  opt = opt || {};
  var W = 420, H = opt.height || 152, P = { t: 10, r: 42, b: 12, l: 2 };
  var all = [];
  series.forEach(function (s) { s.pts.forEach(function (p) { if (p != null) all.push(p); }); });
  (opt.guides || []).forEach(function (g) { all.push(g.v); });
  if (!all.length) return '<div class="empty">no points</div>';
  var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  if (opt.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  var pad = (hi - lo) * 0.14 || 1; lo -= pad; hi += pad;
  var n = Math.max.apply(null, series.map(function (s) { return s.pts.length; }));
  var X = function (i) { return P.l + (i / Math.max(1, n - 1)) * (W - P.l - P.r); };
  var Y = function (v) { return P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b); };
  var o = ['<svg viewBox="0 0 ' + W + ' ' + H + '">'];

  o.push('<text x="' + (W - P.r + 6) + '" y="' + (P.t + 8) + '" fill="#616159" ' +
    'font-family="IBM Plex Mono" font-size="8.5">' + E(opt.fmt(hi)) + '</text>');
  o.push('<text x="' + (W - P.r + 6) + '" y="' + (H - P.b) + '" fill="#616159" ' +
    'font-family="IBM Plex Mono" font-size="8.5">' + E(opt.fmt(lo)) + '</text>');
  (opt.guides || []).forEach(function (g) {
    o.push('<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + Y(g.v) + '" y2="' + Y(g.v) +
      '" stroke="rgba(255,255,255,.10)" stroke-width="1" stroke-dasharray="2 4"/>');
    if (g.t) o.push('<text x="' + (W - P.r + 6) + '" y="' + (Y(g.v) + 3) + '" fill="#3A3A38" ' +
      'font-family="IBM Plex Mono" font-size="8.5">' + E(g.t) + '</text>');
  });
  if (opt.zero && lo < 0 && hi > 0) {
    o.push('<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + Y(0) + '" y2="' + Y(0) +
      '" stroke="rgba(255,255,255,.16)" stroke-width="1"/>');
  }
  if (opt.band && series.length > 1) {
    var a = series[0].pts, b = series[1].pts, up = [], dn = [];
    for (var i = 0; i < n; i++) {
      if (a[i] == null || b[i] == null) continue;
      up.push(X(i).toFixed(1) + ',' + Y(a[i]).toFixed(1));
      dn.unshift(X(i).toFixed(1) + ',' + Y(b[i]).toFixed(1));
    }
    if (up.length) o.push('<polygon points="' + up.concat(dn).join(' ') +
      '" fill="#F2C14E" opacity="0.07"/>');
  }
  series.forEach(function (s) {
    if (s.hidden) return;
    var d = '', on = false;
    s.pts.forEach(function (p, i) {
      if (p == null) { on = false; return; }
      d += (on ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p).toFixed(1) + ' '; on = true;
    });
    o.push('<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="' +
      (s.w || 1.4) + '" stroke-linejoin="round" stroke-linecap="round" opacity="' +
      (s.op == null ? 1 : s.op) + '"/>');
  });
  o.push('</svg>');
  return o.join('');
}

/* ---- state -------------------------------------------------------------- */
var D = null;
var S = { books: { real: 1, shadow_nogates: 1, shadow_nohedge: 1, baseline_naive: 1 },
          tab: 'open', logf: 'all' };

var BOOKS = [
  { k: 'real',            n: 'real',        c: '#F4F4F1', w: 1.9 },
  { k: 'shadow_nogates',  n: 'no gates',    c: '#F2C14E', w: 1.3 },
  { k: 'shadow_nohedge',  n: 'no hedge',    c: '#8A8A83', w: 1.3 },
  { k: 'baseline_naive',  n: 'naive',       c: '#4A4A46', w: 1.3 }
];

/* ---- status bar --------------------------------------------------------- */
function drawStatus() {
  var c = D.counts, r = D.refusals, v = D.verification;
  var closed = D.kv && D.kv.last_tick_mode === 'market_closed';
  var last = null;
  for (var i = (D.decisions || []).length - 1; i >= 0; i--) {
    var k = D.decisions[i].kind;
    if (k === 'order_open' || k === 'order_close' || k === 'order_hedge') { last = D.decisions[i]; break; }
  }
  var act = last
    ? '<span class="dot"></span>' + E(last.kind.replace('order_', 'order ').toUpperCase()) +
      (last.id ? ' · ' + E(last.id) : '') +
      ((last.reason || last.action) ? ' · ' + E((last.reason || last.action).slice(0, 80)) : '') +
      ' · ' + E(ago(last.t))
    : '<span class="dot off"></span>no order yet';

  document.getElementById('status').innerHTML =
    '<span class="grp"><span class="dot' + (closed ? ' off' : '') + '"></span>' +
      '<b>' + (closed ? 'CLOSED' : 'OPEN') + '</b> ' + E(dm(D.last_tick_utc)) +
      ' session · as of ' + E(hm(D.last_tick_utc)) + 'Z</span>' +
    '<span class="grp"><span class="k">cycle</span><b>' + n0(c.ticks) + '</b> ticks ' +
      '<b>' + (D.series.gates || []).length + '</b> evaluated <b>' + n0(c.orders_live) + '</b> orders</span>' +
    '<span class="grp"><span class="k">session</span><b>' + c.structures_total + '</b> structures ' +
      '<b>' + n0(r.all) + '</b> refused <b>' + D.desk.meetings + '</b> meetings</span>' +
    '<span class="grp last"><span class="act">' + act + '</span></span>';
}

/* ---- left rail ---------------------------------------------------------- */
function drawLeft() {
  var alt = {}, s = D.series;
  (s.alt || []).forEach(function (a) {
    if (!a.sym) return;
    alt[a.sym] = alt[a.sym] || { tried: 0, taken: 0, why: '' };
    alt[a.sym].tried++; if (a.taken) alt[a.sym].taken++;
    if (!a.taken && a.reason) alt[a.sym].why = a.reason;
  });
  var uni = (D.params.universe.underlyings || []).map(function (sym) {
    var prim = sym === D.params.universe.primary;
    var st = prim ? String(D.signals.regime || '').toUpperCase()
                  : (alt[sym] && alt[sym].taken ? 'ROTATED IN' : 'NO ENTRY');
    var val = prim ? '+' + (D.signals.atm_iv * 100 - D.signals.rv20 * 100).toFixed(2)
                   : (alt[sym] ? alt[sym].tried + ' tried' : '—');
    return '<div class="ritem' + (prim ? ' on' : ' mute') + '">' +
      '<span class="n">' + E(sym) + '</span><span class="v">' + E(val) + '</span>' +
      '<span class="t">' + E(st) + '</span></div>';
  }).join('');

  var books = BOOKS.map(function (b) {
    var a = D.series.books[b.k] || [], fin = a.length ? a[a.length - 1].v : null;
    return '<div class="ritem' + (S.books[b.k] ? '' : ' mute') + '" data-book="' + b.k + '">' +
      '<span class="n"><span class="sw" style="background:' + b.c + '"></span>' + E(b.n) + '</span>' +
      '<span class="v">' + money(fin, 0) + '</span></div>';
  }).join('');

  var bound = Object.keys(D.refusals.by_gate || {}).length;
  document.getElementById('left').innerHTML =
    '<div class="rgrp"><span class="lab">Universe · ' + (D.params.universe.underlyings || []).length + '</span>' +
      uni +
      '<p class="rnote">The signal is measured on the primary chain only. The other two are ' +
      'entered when the primary has nothing that clears the floor.</p></div>' +
    '<div class="rgrp"><span class="lab">Books · 4</span>' + books +
      '<p class="rnote">Three counterfactuals marked on the identical ticks. Click to show or ' +
      'hide a curve.</p></div>' +
    '<div class="rgrp"><span class="lab">Rule wall · 12</span>' +
      '<div class="ritem"><span class="n">bound</span><span class="v">' + bound + ' of 12</span>' +
      '<span class="t">stopped a trade at least once</span></div>' +
      '<div class="ritem"><span class="n">evaluations</span><span class="v">' +
      (D.series.gates || []).length + '</span><span class="t">each one journalled</span></div>' +
      '<p class="rnote">The model proposes; the wall disposes. It never sees a gate’s input ' +
      'and cannot argue with its output.</p></div>';
}

/* ---- centre ------------------------------------------------------------- */
function drawMid() {
  var sg = D.signals, s = D.series, prem = (sg.atm_iv - sg.rv20) * 100;
  var sig = (s.signal || []).filter(function (p) { return p.iv && p.iv < 0.4; });
  var rich = D.params.regime.vrp_rich_threshold, cheap = D.params.regime.vrp_cheap_threshold;

  var ivrv = spark([
    { pts: sig.map(function (p) { return p.iv * 100; }), color: '#F2C14E', w: 1.6 },
    { pts: sig.map(function (p) { return p.rv * 100; }), color: '#7C7C75', w: 1.3 }
  ], { band: 1, fmt: function (x) { return x.toFixed(0) + '%'; } });

  var eq = spark(BOOKS.map(function (b) {
    return { pts: (s.books[b.k] || []).map(function (p) { return p.v; }),
             color: b.c, w: b.w, hidden: !S.books[b.k] };
  }), { zero: 1, fmt: function (x) { return money(x, 0); } });

  var vrp = spark([{ pts: sig.map(function (p) { return p.vrp; }), color: '#F2C14E', w: 1.5 }],
    { guides: [{ v: rich, t: 'rich' }, { v: cheap, t: 'cheap' }],
      fmt: function (x) { return x.toFixed(1); } });

  var tabs = [['open', 'Open', D.counts.structures_open],
              ['closed', 'Closed', D.counts.structures_closed],
              ['unfilled', 'Unfilled', D.counts.structures_unfilled]];

  document.getElementById('mid').innerHTML =
    '<div class="asof"><span class="lab">as of ' + E(hm(D.last_tick_utc)) + 'Z · ' +
      E(ago(D.last_tick_utc)) + '</span></div>' +

    '<div class="hero"><span class="sym">' + E(D.params.universe.primary) + '</span>' +
      '<span class="px">' + Number(sg.spot).toFixed(2) + '</span>' +
      '<span class="chip hot">vol ' + E(String(sg.regime || '')) + '</span>' +
      '<span class="chip">data ' + E(sg.data_quality || 'full') + '</span></div>' +

    '<div class="kpis">' +
      kpi('Implied · ATM', pct(sg.atm_iv) + '%', 'annualised', 1) +
      kpi('Realized · 20d', pct(sg.rv20) + '%', 'what it actually did') +
      kpi('Premium', '+' + prem.toFixed(2), 'implied minus realized, in vol points') +
      kpi('Ratio', (sg.atm_iv / sg.rv20).toFixed(2) + '×', 'above the ' + rich.toFixed(2) + ' rich threshold') +
    '</div>' +

    '<p class="verdict">Implied volatility exceeds realized by <b>' + prem.toFixed(2) +
      ' points</b>. The market is charging for movement that is not showing up, so the desk sells ' +
      'defined-risk premium and hedges the tail. It takes no view on direction, ever.</p>' +
    '<p class="detail">' + sig.length + ' readings since ' + E(dm(sig.length ? sig[0].t : '')) +
      ' · 5 sessions · 2 quarantined when the feed halved the index after a close · ' +
      'vrp ' + Number(sg.vrp).toFixed(2) + ' on a 0–1 scale where ' + rich.toFixed(2) +
      ' is rich and ' + cheap.toFixed(2) + ' is cheap</p>' +

    '<div class="cards3">' +
      cc('Implied vs realized', 'front month · ' + sig.length + ' obs', ivrv,
         '<i style="background:#F2C14E"></i>implied|<i style="background:#7C7C75"></i>realized') +
      cc('Four books', 'same ticks · counterfactual', eq,
         BOOKS.map(function (b) { return '<i style="background:' + b.c + '"></i>' + b.n; }).join('|')) +
      cc('VRP score', 'sell above rich · buy below cheap', vrp, '') +
    '</div>' +

    '<div class="shead"><h2>Positions</h2><span class="lab">' + D.counts.structures_total +
      ' structures · every worst case computed before the order</span>' +
      '<span class="tabs">' + tabs.map(function (t) {
        return '<button data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' +
          t[1] + ' ' + t[2] + '</button>'; }).join('') + '</span></div>' +
    positionsTable() +
    refusalStrip();
}
function kpi(l, v, c, am) {
  return '<div class="kpi"><span class="lab">' + E(l) + '</span>' +
    '<div class="v' + (am ? ' am' : '') + '">' + v + '</div>' +
    '<div class="c">' + E(c) + '</div></div>';
}
function cc(t, cap, svg, leg) {
  return '<div class="cc"><div class="h"><span class="lab">' + E(t) + '</span></div>' +
    '<div class="cap">' + E(cap) + '</div>' + svg +
    (leg ? '<div class="leg">' + leg.split('|').map(function (x) {
      return '<span>' + x + '</span>'; }).join('') + '</div>' : '') + '</div>';
}
function positionsTable() {
  var rows = D.positions[S.tab] || [];
  if (!rows.length) return '<div class="empty">nothing in this bucket</div>';
  if (S.tab === 'closed') {
    var byId = {}; (D.trades || []).forEach(function (t) { byId[t.id] = t; });
    return '<table><thead><tr><th>Structure</th><th>Legs</th><th class="num">Credit</th>' +
      '<th class="num">Result</th><th class="num">Held</th><th>Window</th></tr></thead><tbody>' +
      rows.map(function (p) {
        var t = byId[p.id] || {};
        return '<tr><td>' + E(p.kind.replace(/_/g, ' ')) + '</td>' +
          '<td class="f">' + legs(p) + '</td>' +
          '<td class="num d">' + money(p.credit) + '</td>' +
          '<td class="num">' + money(p.pnl, 0) + '</td>' +
          '<td class="num f">' + (t.hours == null ? '—' : t.hours + 'h') + '</td>' +
          '<td class="f">' + E(dm(p.opened)) + ' → ' + E(dm(p.closed)) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }
  return '<table><thead><tr><th>Structure</th><th>Legs</th><th class="num">Credit</th>' +
    '<th class="num">Worst case</th><th>Opened</th><th>Status</th></tr></thead><tbody>' +
    rows.map(function (p) {
      return '<tr><td>' + E(p.kind.replace(/_/g, ' ')) + '</td>' +
        '<td class="f">' + legs(p) + '</td>' +
        '<td class="num d">' + money(p.credit) + '</td>' +
        '<td class="num">' + usd(p.max_loss, 0) + '</td>' +
        '<td class="f">' + E(dm(p.opened)) + ' ' + E(hm(p.opened)) + 'Z</td>' +
        '<td class="f">' + E(p.status) + '</td></tr>';
    }).join('') + '</tbody></table>';
}
function legs(p) {
  var u = p.legs[0].symbol.slice(0, 3);
  return E(u) + ' · ' + p.legs.length + ' × ' +
    E(p.legs.map(function (l) { return (l.qty > 0 ? '+' : '−') + Math.abs(l.strike || 0); })
      .join(' '));
}


/* The desk refused four times as often as it traded. That is the product, and
   it is the one thing this screen would otherwise leave to the log alone. */
function refusalStrip() {
  var KIND = { entry_refused: 'a rule refused it', derisk_mode: 'event window',
    no_candidate: 'nothing worth trading', entry_skipped_duplicate: 'already held',
    market_closed: 'market closed', desk_veto: 'desk vetoed', data_suspect: 'data suspect' };
  var bk = D.refusals.by_kind || {}, bg = D.refusals.by_gate || {};
  var defs = {}; (D.gate_defs || []).forEach(function (g) { defs[g.id] = g; });
  var mk = Math.max.apply(null, Object.keys(bk).map(function (k) { return bk[k]; }));
  var mg = Math.max.apply(null, Object.keys(bg).map(function (k) { return bg[k]; }));
  function row(l, v, m) {
    return '<div class="fb"><span class="fl">' + E(l) + '</span>' +
      '<span class="ft"><span class="ff" style="width:' + (100 * v / m).toFixed(1) + '%"></span></span>' +
      '<span class="fv">' + v + '</span></div>';
  }
  return '<div class="shead"><h2>Refusals</h2><span class="lab">' + n0(D.refusals.all) +
    ' times the desk declined · ' + Object.keys(bk).length + ' kinds · every one journalled</span></div>' +
    '<div class="two">' +
      '<div><span class="lab">why a trade did not happen</span><div class="fbars">' +
        Object.keys(bk).map(function (k) { return row(KIND[k] || k, bk[k], mk); }).join('') +
      '</div></div>' +
      '<div><span class="lab">which rule stopped it</span><div class="fbars">' +
        Object.keys(bg).map(function (k) {
          return row((defs[k] || {}).label || k, bg[k], mg); }).join('') +
      '</div></div>' +
    '</div>';
}

/* ---- right rail --------------------------------------------------------- */
function drawRight() {
  var br = D.broker || {}, bk = D.book, g = D.greeks || {}, lim = D.limits, s = D.series;
  var openRisk = (D.positions.open || []).reduce(function (a, p) { return a + (p.max_loss || 0); }, 0);
  var biggest = Math.max.apply(null, (D.positions.open || [])
    .map(function (p) { return p.max_loss || 0; }).concat([0]));
  var dayMax = (s.daily || []).reduce(function (a, x) { return Math.max(a, x.new_risk || 0); }, 0);

  document.getElementById('right').innerHTML =
    '<div class="rh"><span class="lab">Risk authority</span></div>' +
    '<div class="kv">' +
      kvr('account', E(D.account) + ' <em>paper</em>') +
      kvr('equity', usd(br.equity) + ' <em>from $100,000</em>') +
      kvr('profit and loss', money(bk.pnl) + ' <em>' + (bk.pnl_pct >= 0 ? '+' : '−') +
          Math.abs(bk.pnl_pct).toFixed(2) + '%</em>') +
      kvr('banked', money(bk.realized) + ' <em>' + D.counts.structures_closed + ' closed</em>') +
      kvr('open mark', money(bk.unrealized) + ' <em>' + hm(bk.marked_at) + 'Z</em>') +
    '</div>' +
    '<div class="sep"></div>' +
    '<div class="rh"><span class="lab">Exposure</span></div>' +
    '<div class="kv">' +
      kvr('delta', money(g.delta) + ' <em>/ $1 spot</em>') +
      kvr('theta', money(g.theta) + ' <em>/ day</em>') +
      kvr('vega', money(g.vega) + ' <em>/ vol pt</em>') +
    '</div>' +
    '<div class="sep"></div>' +
    '<div class="auth">' +
      au('portfolio worst case', openRisk, lim.portfolio_cap) +
      au('largest single structure', biggest, lim.per_structure) +
      au('new risk in one day', dayMax, lim.daily_new) +
    '</div>' +
    '<p class="rnote2">Each ceiling is a percentage of equity fixed in config.yaml and evaluated ' +
    'in code before an order exists. Nothing on this desk can raise one at runtime.</p>' +
    '<div class="sep"></div>' +
    '<div class="rh"><span class="lab">Audit log</span>' +
      '<a id="full-record">' + n0(D.verification.journal_entries) + ' entries →</a></div>' +
    '<p class="rnote2" style="margin-top:0;margin-bottom:10px">Every decision is traceable. ' +
    'Click any entry for the trace that produced it.</p>' +
    '<div class="chips" id="logchips"></div><div class="log" id="log"></div>';
}
function kvr(k, v) { return '<span class="k">' + E(k) + '</span><span class="v">' + v + '</span>'; }
function au(l, used, limit) {
  var p = limit ? Math.min(100, 100 * used / limit) : 0;
  return '<div class="au"><div class="t"><span>' + E(l) + '</span>' +
    '<span><b>' + usd(used, 0) + '</b> / ' + usd(limit, 0) + '</span></div>' +
    '<span class="tr"><span class="fl" style="width:' + p.toFixed(1) + '%"></span></span></div>';
}

/* ---- audit log ---------------------------------------------------------- */
function logRows() {
  var s = D.series, out = [];
  (s.refusals || []).forEach(function (r) {
    if (r.kind === 'market_closed') return;
    out.push({ t: r.t, tag: r.gate || r.kind, id: 'refused', text: r.reason, hot: 1,
               grp: 'refused' });
  });
  (D.decisions || []).forEach(function (r) {
    if (r.kind.indexOf('order_') !== 0) return;
    out.push({ t: r.t, tag: r.kind.replace('order_', ''), id: r.id,
               text: r.reason || r.action || '', grp: 'orders' });
  });
  (s.desk || []).forEach(function (m) {
    out.push({ t: m.t, tag: m.veto ? 'veto' : m.dis ? 'disagreed' : 'agreed',
               id: m.a + ' / ' + m.b, text: m.why, hot: m.veto, grp: 'desk' });
  });
  (s.gates || []).forEach(function (gt) {
    out.push({ t: gt.t, tag: gt.passed ? 'passed' : 'stopped', id: gt.sid,
               text: gt.kind + ' ×' + gt.qty + (gt.fails.length
                 ? ' — ' + gt.fails[0].gate + ': ' + gt.fails[0].reason : ' — all gates clear'),
               hot: !gt.passed, grp: 'gates', trace: gt.t });
  });
  out.sort(function (a, b) { return a.t < b.t ? 1 : -1; });
  return out;
}
function drawLog() {
  var rows = logRows();
  var counts = { all: rows.length };
  ['refused', 'orders', 'desk', 'gates'].forEach(function (g) {
    counts[g] = rows.filter(function (r) { return r.grp === g; }).length; });
  document.getElementById('logchips').innerHTML =
    ['all', 'refused', 'gates', 'orders', 'desk'].map(function (g) {
      return '<button data-log="' + g + '" aria-pressed="' + (S.logf === g) + '">' +
        g + ' ' + counts[g] + '</button>'; }).join('');
  var show = rows.filter(function (r) { return S.logf === 'all' || r.grp === S.logf; }).slice(0, 60);
  document.getElementById('log').innerHTML = show.map(function (r, i) {
    return '<div class="le' + (r.hot ? ' hot' : '') + '"' +
      (r.trace ? ' data-trace="' + E(r.trace) + '"' : '') + '>' +
      '<div class="r1"><span class="tag">' + E(r.tag) + '</span>' +
      '<span class="id">' + E(r.id) + '</span>' +
      '<span class="tm">' + E(dm(r.t)) + ' ' + E(hm(r.t)) + 'Z</span></div>' +
      '<div class="r2">' + E(r.text) + '</div></div>';
  }).join('') || '<div class="empty">nothing in this filter</div>';
}

/* ---- decision trace ----------------------------------------------------- */
function openTrace(t) {
  var s = D.series;
  var gt = (s.gates || []).filter(function (g) { return g.t === t; })[0];
  if (!gt) return;
  var sig = nearest(s.signal || [], gt.t) || {};
  var desk = nearest(s.desk || [], gt.t) || {};
  var defs = {}; (D.gate_defs || []).forEach(function (g) { defs[g.id] = g; });
  var order = (D.gate_defs || []).map(function (g) { return g.id; });
  var fail = gt.fails[0];

  var gateLine = order.map(function (id) {
    var st = gt.r[id];
    var mark = st === 1 ? '✓' : st === 0 ? '✗' : '–';
    var col = st === 0 ? '#F2C14E' : st === 1 ? '#9C9C95' : '#3A3A38';
    return '<span style="color:' + col + '">' + mark + ' ' + E((defs[id] || {}).label || id) + '</span>';
  }).join('&nbsp;&nbsp;');

  var steps = [
    ['scan', E(D.params.universe.primary) + ' ' + Number(sig.spot).toFixed(2) +
      ' · chain snapshot stored for replay', ''],
    ['measure', 'iv ' + pct(sig.iv) + ' · rv ' + pct(sig.rv) + ' · premium +' +
      ((sig.iv - sig.rv) * 100).toFixed(2) + ' pts · vrp ' + Number(sig.vrp).toFixed(2), ''],
    ['classify', String(sig.vrp >= D.params.regime.vrp_rich_threshold ? 'SELL_VOL'
      : sig.vrp < D.params.regime.vrp_cheap_threshold ? 'BUY_VOL' : 'NEUTRAL'),
      'Two model roles read the tape independently: ' + E(desk.a || '?') + ' and ' +
      E(desk.b || '?') + (desk.dis ? ' — they disagreed, so size was halved.'
      : ' — they agreed.') + (desk.veto ? ' The vetoer blocked the trade.' : '')],
    ['build', E(gt.kind) + ' ×' + gt.qty + (gt.wc ? ' · worst case ' +
      usd(-gt.wc.pnl, 0) + ' at ' + (gt.wc.spot_rel * 100).toFixed(0) + '% of spot (' +
      E(gt.wc.scenario) + ')' : ''), ''],
    ['gate', gateLine, '']
  ];

  var html = '<span class="x" id="trace-x">close · esc</span>' +
    '<h3>' + E(D.params.universe.primary) + '<span class="st">' +
      (gt.passed ? 'passed' : 'refused') + ' · ' + E(dm(gt.t)) + ' ' + E(hm(gt.t)) +
      'Z · ' + E(gt.sid) + '</span></h3>' +
    '<p class="lede">' + (fail
      ? 'The wall stopped this structure at <b>' + E((defs[fail.gate] || {}).label || fail.gate) +
        '</b>. ' + E(fail.reason) + '.'
      : 'Every gate cleared and the order was submitted.') + '</p>' +
    steps.map(function (st, i) {
      var isFail = st[0] === 'gate' && fail;
      return '<div class="step' + (isFail ? ' fail' : '') + '"><span class="n">' + (i + 1) + '</span>' +
        '<div class="b"><span class="lab">' + st[0] + '</span>' +
        '<div class="val">' + st[1] + '</div>' +
        (st[2] ? '<div class="why">' + st[2] + '</div>' : '') +
        (isFail ? '<div class="box"><span class="lab">' +
          E((defs[fail.gate] || {}).label || fail.gate) + ' failed</span>' +
          '<div class="why" style="color:#F4F4F1;margin-top:5px">' + E(fail.reason) + '</div>' +
          '<div class="why" style="margin-top:6px">' + E((defs[fail.gate] || {}).what || '') +
          '</div></div>' : '') +
        '</div></div>';
    }).join('') +
    '<div class="step"><span class="n">6</span><div class="b"><span class="lab">outcome</span>' +
      '<div class="val">' + (gt.passed ? 'ORDER SUBMITTED' : 'REFUSED — no order was sent') +
      '</div><div class="why">This trace is rebuilt from the journal, not written for the page. ' +
      'The snapshot the desk saw at ' + E(hm(gt.t)) + 'Z is stored, so this tick can be replayed ' +
      'and must produce the same result.</div></div></div>';

  document.getElementById('trace-sheet').innerHTML = html;
  document.getElementById('trace').classList.add('on');
  document.getElementById('trace-x').onclick = closeTrace;
}
function closeTrace() { document.getElementById('trace').classList.remove('on'); }

/* ---- footer ------------------------------------------------------------- */
function drawFoot() {
  var v = D.verification;
  document.getElementById('foot').innerHTML =
    '<span>paper trading only · hypothetical results · direction is never an input</span>' +
    '<span class="sp"></span>' +
    '<span>chain <b>' + (v.chain_ok ? 'intact' : 'BROKEN') + '</b></span>' +
    '<span>tests <b>' + v.test_defs + '/' + (v.tests_collected || '—') + '</b></span>' +
    '<span>claims <b>' + v.claims_total + '/' + v.claims_total + '</b></span>' +
    '<span>corrections <b>' + v.devlog + '</b></span>' +
    '<span>every figure from one file @ <b>' + E(D.commit) + '</b></span>' +
    '<span>' + E(String(D.generated_utc).slice(0, 16).replace('T', ' ')) + 'Z</span>';
}

/* ---- wiring ------------------------------------------------------------- */
function renderAll() { drawStatus(); drawLeft(); drawMid(); drawRight(); drawLog(); drawFoot(); }

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-book]');
  if (b) { S.books[b.dataset.book] = !S.books[b.dataset.book]; drawLeft(); drawMid(); return; }
  var t = e.target.closest('[data-tab]');
  if (t) { S.tab = t.dataset.tab; drawMid(); return; }
  var l = e.target.closest('[data-log]');
  if (l) { S.logf = l.dataset.log; drawLog(); return; }
  var tr = e.target.closest('[data-trace]');
  if (tr) { openTrace(tr.dataset.trace); return; }
  if (e.target.id === 'trace') closeTrace();
  if (e.target.id === 'full-record') { S.logf = 'all'; drawLog(); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeTrace(); });

/* ---- boot --------------------------------------------------------------- */
function boot(d) {
  D = d;
  try { renderAll(); }
  catch (err) {
    document.getElementById('mid').innerHTML =
      '<div class="empty">This console failed to render: ' + E(err.message) + '</div>';
    throw err;
  }
}
if (window.__DATA__) { boot(window.__DATA__); }
else {
  fetch('data.json?' + Math.floor(Date.now() / 60000))
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(boot)
    .catch(function (e) {
      document.getElementById('boot').textContent =
        'data.json could not be loaded (' + e.message + '). Run: python tools/site_data.py';
    });
}
})();
</script>
