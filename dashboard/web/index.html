<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THETA DESK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="console.css">
</head>
<body>

<div id="shell">
  <header id="status"></header>
  <section id="kpi"></section>
  <div id="body">
    <aside id="left"></aside>
    <main id="mid"><nav id="tabs"></nav><div id="pane"><div class="empty" id="boot">Loading data.json…</div></div></main>
    <aside id="right"></aside>
  </div>
  <footer id="foot"></footer>
</div>

<div id="tip"></div>

<div id="trace" role="dialog" aria-modal="true"><div class="sheet" id="trace-sheet"></div></div>

<script>
/* ===========================================================================
   THETA DESK console.

   Every figure is a field of dashboard/web/data.json, regenerated by
   tools/site_data.py on every tick. Nothing here computes a number that is not
   arithmetic on those fields, so no two surfaces in this submission can
   disagree about anything.

   Seven workspaces behind one tab bar. The rails either side never change, so
   the account, the ceilings and the log stay readable from any workspace — you
   can open the page, see how the desk is doing, and only then go looking.
   ======================================================================== */
(function () {
'use strict';

/* ---- formatting --------------------------------------------------------- */
var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
function money(v, d) {
  if (v == null || isNaN(v)) return '—';
  d = d == null ? 2 : d;
  return (v < 0 ? '−' : '+') + '$' + Math.abs(v).toLocaleString('en-US',
    { minimumFractionDigits: d, maximumFractionDigits: d });
}
function usd(v, d) {
  if (v == null || isNaN(v)) return '—';
  d = d == null ? 2 : d;
  return '$' + Number(v).toLocaleString('en-US',
    { minimumFractionDigits: d, maximumFractionDigits: d });
}
function sgn(v) { return v == null || v === 0 ? '' : v > 0 ? 'up' : 'down'; }
/* the one place colour carries meaning: the sign of money */
function m(v, d) { return '<span class="' + sgn(v) + '">' + money(v, d) + '</span>'; }
function pct(v, d) { return v == null ? '—' : (v * 100).toFixed(d == null ? 2 : d); }
function sg2(v, d) {
  if (v == null || isNaN(v)) return '—';
  return (v < 0 ? '−' : '+') + Math.abs(v).toFixed(d == null ? 2 : d);
}
function n0(v) { return v == null ? '—' : Number(v).toLocaleString('en-US'); }
function hm(t) { return t ? String(t).slice(11, 16) : '—'; }
function dm(t) { return t ? String(t).slice(5, 10) : '—'; }
function ago(iso) {
  if (!iso) return '';
  var ms = Date.now() - Date.parse(iso.length <= 19 ? iso + 'Z' : iso);
  if (isNaN(ms) || ms < 0) return '';
  var h = Math.floor(ms / 3.6e6), mm = Math.round((ms % 3.6e6) / 6e4);
  return h > 0 ? h + 'h ' + mm + 'm ago' : mm + 'm ago';
}
function nearest(arr, t) {
  var out = null;
  for (var i = 0; i < arr.length; i++) { if (arr[i].t <= t) out = arr[i]; else break; }
  return out || arr[0] || null;
}

var CHARTS = {};

/* ---- charts ------------------------------------------------------------- */
/* Ordinal tick index rather than wall-clock: the series are sampled every
   fifteen minutes inside a session and not at all between them, so a time axis
   would be mostly empty gap. One step is one tick, and session boundaries are
   ruled in, so the gaps stay visible where they matter. */
function chart(series, o) {
  o = o || {};
  var W = 1000, H = o.h || 300, P = { t: 18, r: 66, b: o.xs ? 28 : 14, l: 6 };
  var all = [];
  series.forEach(function (s) { if (!s.hidden) s.pts.forEach(function (p) {
    if (p != null) all.push(p); }); });
  (o.guides || []).forEach(function (g) { all.push(g.v); });
  if (!all.length) return '<div class="empty">no series selected</div>';
  var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  var pad = (hi - lo) * 0.12 || 1; lo -= pad; hi += pad;
  var n = Math.max.apply(null, series.map(function (s) { return s.pts.length; }));
  var X = function (i) { return P.l + (i / Math.max(1, n - 1)) * (W - P.l - P.r); };
  var Y = function (v) { return P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b); };
  var uid = 'g' + (chart.seq = (chart.seq || 0) + 1);
  var out = ['<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" data-ch="' + uid + '">'];
  if (o.area) out.push('<defs><linearGradient id="' + uid + '" x1="0" y1="0" ' +
    'x2="0" y2="1"><stop offset="0" stop-color="' + o.area + '" stop-opacity=".26"/>' +
    '<stop offset="1" stop-color="' + o.area + '" stop-opacity="0"/></linearGradient></defs>');

  for (var g = 0; g <= 4; g++) {
    var v = lo + (hi - lo) * (g / 4), y = Y(v);
    out.push('<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y.toFixed(1) + '" y2="' +
      y.toFixed(1) + '" stroke="rgba(255,255,255,.055)" stroke-width="1"/>');
    out.push('<text x="' + (W - P.r + 9) + '" y="' + (y + 3.5).toFixed(1) + '" fill="#616159" ' +
      'font-family="IBM Plex Mono" font-size="10">' + E(o.fmt(v)) + '</text>');
  }
  (o.guides || []).forEach(function (gd) {
    out.push('<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + Y(gd.v) + '" y2="' + Y(gd.v) +
      '" stroke="rgba(242,193,78,.30)" stroke-width="1" stroke-dasharray="3 4"/>');
    out.push('<text x="' + (W - P.r + 9) + '" y="' + (Y(gd.v) + 3.5) + '" fill="#616159" ' +
      'font-family="IBM Plex Mono" font-size="10">' + E(gd.t) + '</text>');
  });
  if (o.zero && lo < 0 && hi > 0) {
    out.push('<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + Y(0) + '" y2="' + Y(0) +
      '" stroke="rgba(255,255,255,.22)" stroke-width="1"/>');
  }
  var lastLabel = -1e9;
  (o.sessions || []).forEach(function (s) {
    out.push('<line x1="' + X(s.i) + '" x2="' + X(s.i) + '" y1="' + P.t + '" y2="' + (H - P.b) +
      '" stroke="rgba(255,255,255,.06)" stroke-width="1"/>');
    /* two sessions can sit a couple of ticks apart; a label every time would
       overprint the one before it */
    if (o.xs && X(s.i) - lastLabel > 56) {
      lastLabel = X(s.i);
      out.push('<text x="' + X(s.i) + '" y="' + (H - 8) + '" fill="#3A3A38" ' +
        'text-anchor="middle" font-family="IBM Plex Mono" font-size="10">' + E(s.t) + '</text>');
    }
  });
  if (o.band && series.length > 1 && !series[0].hidden && !series[1].hidden) {
    var a = series[0].pts, b = series[1].pts, up = [], dn = [];
    for (var i = 0; i < n; i++) {
      if (a[i] == null || b[i] == null) continue;
      up.push(X(i).toFixed(1) + ',' + Y(a[i]).toFixed(1));
      dn.unshift(X(i).toFixed(1) + ',' + Y(b[i]).toFixed(1));
    }
    if (up.length) out.push('<polygon points="' + up.concat(dn).join(' ') +
      '" fill="#F2C14E" opacity="0.09"/>');
  }
  series.forEach(function (s) {
    if (s.hidden) return;
    var d = '', on = false, last = null, li = 0;
    s.pts.forEach(function (p, i) {
      if (p == null) { on = false; return; }
      d += (on ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p).toFixed(1) + ' ';
      on = true; last = p; li = i;
    });
    if (o.area && s.fill) {
      var base = Y(o.zero ? Math.max(lo, Math.min(hi, 0)) : lo);
      out.push('<path d="' + d + 'L' + X(li).toFixed(1) + ' ' + base.toFixed(1) + ' L' +
        X(0).toFixed(1) + ' ' + base.toFixed(1) + ' Z" fill="url(#' + uid + ')" stroke="none"/>');
    }
    out.push('<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="' +
      (s.w || 1.7) + '" stroke-linejoin="round" stroke-linecap="round"/>');
    if (last != null && s.tip) {
      out.push('<circle cx="' + X(li).toFixed(1) + '" cy="' + Y(last).toFixed(1) +
        '" r="3.2" fill="' + s.color + '"/>');
      out.push('<circle cx="' + X(li).toFixed(1) + '" cy="' + Y(last).toFixed(1) +
        '" r="7" fill="none" stroke="' + s.color + '" stroke-opacity=".28"/>');
      out.push('<rect x="' + (W - P.r + 4) + '" y="' + (Y(last) - 9).toFixed(1) + '" width="56" ' +
        'height="18" rx="3" fill="' + s.color + '"/>');
      out.push('<text x="' + (W - P.r + 32) + '" y="' + (Y(last) + 3.5).toFixed(1) +
        '" text-anchor="middle" fill="#08080A" font-family="IBM Plex Mono" font-size="10.5" ' +
        'font-weight="500">' + E(o.fmt(last)) + '</text>');
    }
  });
  /* the layer the pointer drives: one rule, one dot per visible series */
  out.push('<g class="xh" style="display:none">');
  out.push('<line class="xhl" x1="0" x2="0" y1="' + P.t + '" y2="' + (H - P.b) +
    '" stroke="rgba(255,255,255,.34)" stroke-width="1"/>');
  series.forEach(function (s2, i2) {
    if (s2.hidden) return;
    out.push('<circle class="xhd" data-s="' + i2 + '" r="3.4" fill="' + s2.color +
      '" stroke="#08080A" stroke-width="1.5" cx="-99" cy="-99"/>');
  });
  out.push('</g>');
  out.push('</svg>');

  CHARTS[uid] = {
    W: W, H: H, P: P, n: n, lo: lo, hi: hi, fmt: o.fmt, times: o.times || null,
    series: series.map(function (s3) {
      return { pts: s3.pts, color: s3.color, name: s3.name || '', hidden: !!s3.hidden };
    })
  };
  return out.join('');
}
function sessionMarks(rows) {
  var out = [], seen = {};
  rows.forEach(function (r, i) {
    var d = String(r.t).slice(0, 10);
    if (!seen[d]) { seen[d] = 1; out.push({ i: i, t: dm(r.t) }); }
  });
  return out.slice(1);
}

/* ---- state -------------------------------------------------------------- */
var D = null;
var LOADED = 0;        /* when this browser last had fresh bytes */
var EMBEDDED = false;  /* true when a host injected the data */
var AUTO = true;       /* poll for a new export */
var PULSE = null;      /* the read-only broker heartbeat */
var PULSE_AT = 0;
var S = { tab: 'desk', books: { real: 1, shadow_nogates: 1, shadow_nohedge: 1, baseline_naive: 1 },
          pos: 'open', logf: 'all', gate: null, open: {}, view: 'equity', sym: null };

var BOOKS = [
  { k: 'real',           n: 'real',      c: '#F4F4F1', w: 2.1, tip: 1 },
  { k: 'shadow_nogates', n: 'no gates',  c: '#F2C14E', w: 1.5 },
  { k: 'shadow_nohedge', n: 'no hedge',  c: '#8A8A83', w: 1.5 },
  { k: 'baseline_naive', n: 'naive',     c: '#4A4A46', w: 1.4 }
];
var TABS = [
  ['desk', 'Desk', ''],
  ['book', 'Book', function () { return D.counts.structures_total; }],
  ['rules', 'Rules', function () { return D.refusals.all; }],
  ['proof', 'Proof', function () { return D.verification.claims_total; }]
];
/* what the one chart frame on the desk is showing */
var VIEWS = [
  ['equity', 'Equity'], ['books', 'Four books'],
  ['ivrv', 'Implied vs realized'], ['vrp', 'VRP score']
];

/* ---- status ------------------------------------------------------------- */
function drawStatus() {
  var c = D.counts, closed = D.kv && D.kv.last_tick_mode === 'market_closed';
  var last = null;
  for (var i = (D.decisions || []).length - 1; i >= 0; i--) {
    if (D.decisions[i].kind.indexOf('order_') === 0) { last = D.decisions[i]; break; }
  }
  var act = last
    ? '<span class="dot"></span>' + E(last.kind.replace('order_', 'order ').toUpperCase()) +
      (last.id ? ' · ' + E(last.id) : '') +
      ((last.reason || last.action) ? ' · ' + E((last.reason || last.action).slice(0, 78)) : '') +
      ' · ' + E(ago(last.t))
    : '<span class="dot off"></span>no order yet';
  document.getElementById('status').innerHTML =
    '<span class="grp"><span class="dot' + (closed ? ' off' : '') + '"></span><b>' +
      (closed ? 'CLOSED' : 'OPEN') + '</b> ' + E(dm(D.last_tick_utc)) + ' session · as of ' +
      E(hm(D.last_tick_utc)) + 'Z</span>' +
    '<span class="grp drop1"><span class="k">cycle</span><b>' + n0(c.ticks) + '</b> ticks <b>' +
      (D.series.gates || []).length + '</b> evaluated <b>' + n0(c.orders_live) + '</b> orders</span>' +
    '<span class="grp drop2"><span class="k">session</span><b>' + c.structures_total +
      '</b> structures <b>' + n0(D.refusals.all) + '</b> refused <b>' + D.desk.meetings +
      '</b> meetings</span>' +
    '<span class="grp" id="pulse" title="A read-only poll of the exchange clock, ' +
      'the account and the last print. It has no order path.">' +
      '<span class="k">broker pulse</span><span class="pdot" id="pdot"></span>' +
      '<b id="pv">—</b><span id="pmkt"></span></span>' +
    '<span class="grp"><span class="k">next tick</span><b id="nx">—</b></span>' +
    '<span class="grp last">' +
      '<button class="rbtn" id="reload" title="fetch the export again">refresh</button>' +
      '<span class="age" id="age">—</span>' +
      '<span class="act">' + act + '</span></span>';
  tickClock();
}

/* The scheduler fires every fifteen minutes from 13:30 to 20:00 UTC, Monday to
   Friday. Saying when the next one lands is the difference between a page that
   looks stale and a page that is between ticks. */
function nextTick(now) {
  var d = new Date(now.getTime());
  var day = d.getUTCDay();
  function at(h, mi, addDays) {
    var x = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(),
      d.getUTCDate() + (addDays || 0), h, mi, 0, 0));
    return x;
  }
  if (day === 0 || day === 6) return null;
  var mins = d.getUTCHours() * 60 + d.getUTCMinutes();
  if (mins < 13 * 60 + 30) return at(13, 30);
  if (mins >= 20 * 60) return null;
  var since = mins - (13 * 60 + 30);
  var nextSlot = (Math.floor(since / 15) + 1) * 15 + 13 * 60 + 30;
  if (nextSlot >= 20 * 60) return null;
  return at(Math.floor(nextSlot / 60), nextSlot % 60);
}
function tickClock() {
  var now = new Date(), nx = nextTick(now), el = document.getElementById('nx');
  if (!el) return;
  if (!nx) { el.textContent = 'market closed'; el.className = ''; return; }
  var m = Math.max(0, Math.round((nx - now) / 60000));
  el.textContent = m + 'm';
  el.className = m <= 1 ? 'am' : '';
}
function ageClock() {
  var el = document.getElementById('age');
  if (!el || !LOADED) return;
  var sec = Math.round((Date.now() - LOADED) / 1000);
  var txt = sec < 60 ? sec + 's ago' : Math.round(sec / 60) + 'm ago';
  el.textContent = (EMBEDDED ? 'served ' : 'checked ') + txt;
  el.className = 'age' + (sec > 15 * 60 ? ' stale' : '');
}

/* ---- left rail ---------------------------------------------------------- */
function drawLeft() {
  var alt = {};
  (D.series.alt || []).forEach(function (a) {
    if (!a.sym) return;
    alt[a.sym] = alt[a.sym] || { tried: 0, taken: 0 };
    alt[a.sym].tried++; if (a.taken) alt[a.sym].taken++;
  });
  var prim = D.params.universe.primary;
  var uni = (D.params.universe.underlyings || []).map(function (sym) {
    var f = symFacts(sym), on = sym === curSym();
    return '<div class="ritem' + (on ? ' on' : '') + '" data-sym="' + E(sym) + '">' +
      '<span class="n">' + E(sym) + '</span><span class="v">' +
      (f.primary ? sg2(D.signals.atm_iv * 100 - D.signals.rv20 * 100)
         : (f.open + f.closed) ? (f.open + f.closed) + ' held' : f.tried + ' tried') + '</span>' +
      '<span class="t">' + (f.primary ? 'vol ' + E(D.signals.regime)
        : f.taken ? 'rotated in ' + f.taken + 'x' : 'never taken') + '</span></div>';
  }).join('');
  var books = BOOKS.map(function (b) {
    var a = D.series.books[b.k] || [], fin = a.length ? a[a.length - 1].v : null;
    return '<div class="ritem' + (S.books[b.k] ? '' : ' mute') + '" data-book="' + b.k + '">' +
      '<span class="n"><span class="sw" style="background:' + b.c + '"></span>' + E(b.n) + '</span>' +
      '<span class="v">' + m(fin, 0) + '</span></div>';
  }).join('');
  var day = (D.series.daily || []).slice().reverse().map(function (x) {
    return '<div class="ritem" data-tab="rules"><span class="n">' + E(x.day.slice(5)) + '</span>' +
      '<span class="v">' + (x.entries || 0) + ' in · ' + (x.gate_rejections || 0) + ' out</span></div>';
  }).join('');
  /* the rail is controls, not prose: what each group means is a title, so the
     column stays a column instead of a page of explanation */
  document.getElementById('left').innerHTML =
    '<div class="rgrp" title="The signal is measured on the primary chain only. The others are ' +
      'entered when the primary has nothing that clears the credit and liquidity floor. Click ' +
      'one to inspect it."><span class="lab">Universe · ' +
      (D.params.universe.underlyings || []).length + '</span>' + uni + '</div>' +
    '<div class="rgrp" title="Three counterfactual books marked on the identical ticks. Click to ' +
      'show or hide a curve on the ablation chart."><span class="lab">Books · 4</span>' +
      books + '</div>' +
    '<div class="rgrp" title="Entries opened against gate rejections, per session. Click a ' +
      'session to open the rules workspace."><span class="lab">Sessions · ' +
      (D.series.daily || []).length + '</span>' + day + '</div>';
}

/* What the desk knows about one underlying. The signal series exists only for
   the primary chain — that is a fact about the strategy, not a gap in the page —
   so for the others this reports what there is: rotation attempts, what was
   taken from them, and the structures actually held. */
function symFacts(sym) {
  var f = { sym: sym, tried: 0, taken: 0, spot: null, open: 0, closed: 0, risk: 0, pnl: 0,
            primary: sym === D.params.universe.primary };
  (D.series.alt || []).forEach(function (a) {
    if (a.sym !== sym) return;
    f.tried++;
    if (a.taken) { f.taken++; if (a.spot) f.spot = a.spot; }
  });
  ['open', 'closed', 'unfilled'].forEach(function (b) {
    (D.positions[b] || []).forEach(function (q) {
      if (q.legs[0].symbol.slice(0, 3) !== sym) return;
      if (b === 'open') { f.open++; f.risk += q.max_loss || 0; }
      if (b === 'closed') { f.closed++; f.pnl += q.pnl || 0; }
    });
  });
  if (f.primary) f.spot = D.signals.spot;
  return f;
}
function curSym() { return S.sym || D.params.universe.primary; }

/* ---- tab bar and KPI strip ---------------------------------------------- */
function drawTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(function (t) {
    var n = typeof t[2] === 'function' ? t[2]() : t[2];
    return '<button data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] +
      (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }).join('');
}
function kc(l, v, s, cls, id) {
  return '<div class="kc"' + (id ? ' id="' + id + '"' : '') + '><span class="lab">' +
    E(l) + '</span>' +
    '<div class="v' + (cls ? ' ' + cls : '') + '">' + v + '</div>' +
    '<div class="s">' + s + '</div></div>';
}
function drawKpi() {
  var b = D.broker || {}, bk = D.book, c = D.counts;
  var openRisk = (D.positions.open || []).reduce(function (a, p) { return a + (p.max_loss || 0); }, 0);
  var wins = (D.trades || []).filter(function (t) { return t.pnl > 0; }).length;
  var v = D.verification, integ = D.series.integrity || [];
  var bound = Object.keys(D.refusals.by_gate || {}).length;
  document.getElementById('kpi').innerHTML =
    kc('Equity', usd(b.equity, 0), 'Alpaca paper ' + E(D.account) + ' · read ' +
       hm(b.asof_utc) + 'Z', '', 'kpi-eq') +
    kc('Profit and loss', m(bk.pnl, 0), 'from $100,000 · <span class="' + sgn(bk.pnl) + '">' +
       (bk.pnl_pct >= 0 ? '+' : '−') + Math.abs(bk.pnl_pct).toFixed(2) + '%</span> · marked ' +
       hm(bk.marked_at) + 'Z') +
    kc('Banked', m(bk.realized, 0), c.structures_closed + ' closed · ' + wins +
       ' won · cannot be lost') +
    kc('Open mark', m(bk.unrealized, 0), c.structures_open + ' open · moves until they close') +
    kc('Risk deployed', usd(openRisk, 0), 'worst case fixed at entry · ' +
       (100 * openRisk / D.limits.portfolio_cap).toFixed(0) + '% of the ceiling') +
    kc('Refused', n0(D.refusals.all), Object.keys(D.refusals.by_kind).length + ' kinds · ' +
       bound + ' of 12 gates have ever bound') +
    kc('Live', hm(D.last_tick_utc) + 'Z', n0(c.ticks) + ' ticks · ' + n0(c.orders_live) +
       ' live orders · ' + integ.filter(function (x) { return x.ok; }).length + ' of ' +
       integ.length + ' integrity checks clean',
       v.chain_ok ? '' : 'down');
}
function b4(l, v, c, cls) {
  return '<div><span class="lab">' + E(l) + '</span><div class="v ' + (cls || '') + '">' + v +
    '</div><div class="c">' + E(c) + '</div></div>';
}
function block(title, lab, right, body, flush) {
  return '<div class="block"><div class="bh"><h3>' + E(title) + '</h3>' +
    '<span class="lab">' + E(lab) + '</span>' + (right || '') + '</div>' +
    '<div class="bb' + (flush ? ' flush' : '') + '">' + body + '</div></div>';
}
function ceil(name, used, limit, why) {
  var p = limit ? Math.min(100, 100 * used / limit) : 0;
  return '<div class="ceil"><div class="h"><span class="name">' + E(name) + '</span>' +
    '<span class="lab">ceiling ' + usd(limit, 0) + '</span></div>' +
    '<div class="row"><span class="t"><span class="f" style="width:' + p.toFixed(1) +
    '%"></span></span><span class="n">' + usd(used, 0) + ' · ' + p.toFixed(1) + '%</span></div>' +
    '<p class="why">' + E(why) + '</p></div>';
}
function bar(l, v, max, gate) {
  return '<div class="bar' + (gate && S.gate === gate ? ' on' : '') + '"' +
    (gate ? ' data-gate="' + E(gate) + '"' : '') + '>' +
    '<span class="l" title="' + E(l) + '">' + E(l) + '</span>' +
    '<span class="t"><span class="f" style="width:' + (100 * v / max).toFixed(1) + '%"></span></span>' +
    '<span class="v">' + v + '</span></div>';
}

/* The verdict is written from the regime, not for the regime the desk happened
   to be in when the page was built. Fed a cheap tape it says the desk is buying
   convexity, because that is what the strategy does. */
function verdict(sg, prem) {
  var r = String(sg.regime || '');
  if (r === 'rich') {
    return 'Implied volatility exceeds realized by <b>' + sg2(prem) + ' points</b>. The market ' +
      'is charging for movement that is not showing up, so the desk sells defined-risk premium ' +
      'and hedges the tail. It takes no view on direction, ever.';
  }
  if (r === 'cheap') {
    return 'Implied volatility sits <b>' + sg2(prem) + ' points</b> under realized. Movement is ' +
      'being underpriced, so the desk stops selling premium and buys convexity with defined ' +
      'risk instead. It takes no view on direction, ever.';
  }
  return 'Implied and realized volatility are within <b>' + sg2(prem) + ' points</b> of each ' +
    'other, inside the band where neither side of the trade is being overpaid. The desk stands ' +
    'down: no new premium is sold and no convexity is bought.';
}

/* ---- the size ladder (DEVLOG #36): every ceiling is a rung, not a constant */
function pctf(x) {
  if (x == null || isNaN(x)) return '—';
  var p = 100 * x; return (Math.abs(p - Math.round(p)) < 1e-9 ? p.toFixed(0) : p.toFixed(1)) + '%';
}
function ladderLine() {
  var L = D.ladder || {};
  if (!L.enabled) return 'percentages of equity, fixed in config and enforced in code';
  /* block() escapes this label, so it is plain text on purpose */
  var s = 'size ladder · rung ' + L.tier + ' · ' + n0(L.closed) + ' closed, ' +
    money(L.realized, 0) + ' realised';
  if (L.demoted) s += ' · ' + L.demoted + ' rung' + (L.demoted > 1 ? 's' : '') +
    ' taken back at ' + pctf(L.drawdown) + ' drawdown';
  else if (L.next) s += ' · next: ' + E(L.next.name) + ' at ' + n0(L.next.min_closed) + ' closed';
  else s += ' · top rung';
  return s;
}

/* The fast hand (DEVLOG #36b). A quiet pass writes nothing to the journal, so
   the evidence it ran is the store's own counter — which is what the watchdog
   reads too. Both numbers, or the cadence alone before the first session. */
function manageLine() {
  var g = D.manage || {};
  if (!g.passes_today) return 'exits checked every ' + (g.interval_s || 60) + 's';
  return n0(g.passes_today) + ' passes today, ' + n0(g.closes_today) + ' close' +
    (g.closes_today === 1 ? '' : 's') + ' fired';
}

/* ---- workspace · desk --------------------------------------------------- */
function paneDesk() {

  var integ = D.series.integrity || [];
  return     '<div class="hero"><span class="sym">' + E(f.sym) + '</span>' +
      '<span class="px">' + (f.spot ? Number(f.spot).toFixed(2) : '—') + '</span>' +
      (f.primary

        : '<span class="chip">' + (f.taken ? 'rotation underlying' : 'never entered') + '</span>' +
          '<span class="chip">no signal series</span>') + '</div>' +
    (f.primary

          b4('Implied · ATM', pct(sg.atm_iv) + '%', 'annualised', 'am') +
          b4('Realized · 20d', pct(sg.rv20) + '%', 'what the index actually did') +
          b4('Premium', sg2(prem), 'implied minus realized, in vol points',
             prem >= 0 ? '' : 'down') +
          b4('Ratio', (sg.atm_iv / sg.rv20).toFixed(2) + 'x',
             'rich above ' + D.params.regime.vrp_rich_threshold.toFixed(2) +

        '</div>' +
        '<p class="verdict">' + verdict(sg, prem) + '</p>'
      : '<div class="big4">' +
          b4('Rotation attempts', n0(f.tried), 'ticks where the primary had nothing to trade') +
          b4('Chains taken', n0(f.taken), f.taken ? 'a candidate was built from this chain'
             : 'never cleared the credit floor', f.taken ? 'am' : '') +
          b4('Structures held', n0(f.open + f.closed), f.open + ' open, ' + f.closed + ' closed') +
          b4('Worst case held', usd(f.risk, 0), f.risk ? 'defined before entry'
             : 'nothing at risk here') +
        '</div>' +
        '<p class="verdict">The desk measures its signal on <b>' + E(D.params.universe.primary) +
        '</b> only — one chain, one volatility surface, no cross-name inference. ' + E(f.sym) +
        ' is a rotation underlying: it is considered when the primary has nothing that clears the ' +

    chartFrame() +

          ' rung. A candidate that would breach it never reaches the broker.') +
        ceil('The whole book', openRisk, lim.portfolio_cap,
          'Every open leg repriced together over a ±20% grid at expiry, against ' +

          'taken back by drawdown; a model cannot move either number.')) +
      block('The desk right now', D.counts.structures_open + ' open · ' +
        D.counts.structures_closed + ' closed · ' + D.counts.structures_unfilled + ' never filled',
        '<span class="seg"><button data-tab="book">positions →</button></span>',
        '<div class="kv2" style="font-size:11.5px;line-height:1.95">' +
        '<span>delta</span><span>' + m(D.greeks.delta) + ' per $1 of spot</span>' +
        '<span>theta</span><span>' + m(D.greeks.theta) + ' per day if nothing moves</span>' +
        '<span>vega</span><span>' + m(D.greeks.vega) + ' per volatility point</span>' +
        '<span>headroom</span><span>' + usd(lim.portfolio_cap - openRisk, 0) +
          ' before the ceiling</span>' +
        '<span>integrity</span><span>' + integ.filter(function (x) { return x.ok; }).length +
          ' of ' + integ.length + ' checks clean</span>' +
        '<span>last tick</span><span>' + E(hm(D.last_tick_utc)) + 'Z, ' +
          E(ago(D.last_tick_utc)) + '</span>' +
        (D.last_manage_utc ? '<span>last managed</span><span>' + E(hm(D.last_manage_utc)) +
          'Z, ' + E(ago(D.last_manage_utc)) + ' · ' + manageLine() + '</span>' : '') +
        '</div>' +
        '<p class="rnote" style="padding:0;margin-top:12px">Greeks are exposure in dollars: what ' +

/* One chart frame, four things to put in it. A console does not need a tab per
   series; it needs one good chart and a way to change what is on it. */
function chartFrame() {
  var s = D.series, rows = s.books.real || [];
  var sig = (s.signal || []).filter(function (q) { return q.iv && q.iv < 0.4; });
  var rich = D.params.regime.vrp_rich_threshold, cheap = D.params.regime.vrp_cheap_threshold;
  var body, sub, foot;
  if (S.view === 'books') {
    body = chart(BOOKS.map(function (b) {
      return { pts: (s.books[b.k] || []).map(function (q) { return q.v; }), color: b.c, w: b.w,
               tip: b.tip, fill: b.k === 'real', name: b.n, hidden: !S.books[b.k] };
    }), { h: 330, zero: 1, xs: 1, area: '#F2C14E', sessions: sessionMarks(rows),
          times: rows.map(function (q) { return q.t; }),
          fmt: function (x) { return money(x, 0); } });
    sub = 'the real book against three counterfactuals on the identical ticks';
    foot = BOOKS.map(function (b) {
      return '<button data-book="' + b.k + '" class="' + (S.books[b.k] ? '' : 'off') + '">' +
        '<i style="background:' + b.c + '"></i>' + b.n + '</button>'; }).join('');
  } else if (S.view === 'ivrv') {
    body = chart([
      { pts: sig.map(function (q) { return q.iv * 100; }), color: '#F2C14E', w: 2, tip: 1,
        name: 'implied' },
      { pts: sig.map(function (q) { return q.rv * 100; }), color: '#8A8A83', w: 1.7, tip: 1,
        name: 'realized' }],
      { h: 330, band: 1, xs: 1, sessions: sessionMarks(sig),
        times: sig.map(function (q) { return q.t; }),
        fmt: function (x) { return x.toFixed(2) + '%'; } });
    sub = sig.length + ' readings · the shaded band is the premium being sold';
    foot = '<span><i style="background:#F2C14E"></i>implied</span>' +
      '<span><i style="background:#8A8A83"></i>realized</span>';
  } else if (S.view === 'vrp') {
    body = chart([{ pts: sig.map(function (q) { return q.vrp; }), color: '#F2C14E', w: 2, tip: 1,
      name: 'vrp' }], { h: 330, xs: 1, sessions: sessionMarks(sig),
      times: sig.map(function (q) { return q.t; }),
      guides: [{ v: rich, t: 'rich ' + rich }, { v: cheap, t: 'cheap ' + cheap }],
      fmt: function (x) { return x.toFixed(2); } });
    sub = '0 to 1 · sell defined-risk premium above rich, buy convexity below cheap';
    foot = '<span>above ' + rich + ' the desk sells · below ' + cheap + ' it buys · between, it stands down</span>';
  } else {
    body = chart([{ pts: rows.map(function (q) { return q.v; }), color: '#F4F4F1', w: 2.2,
      tip: 1, fill: 1, name: 'real' }],
      { h: 330, zero: 1, xs: 1, area: '#F2C14E', sessions: sessionMarks(rows),
        times: rows.map(function (q) { return q.t; }),
        fmt: function (x) { return money(x, 0); } });
    sub = rows.length + ' marks · 5 sessions · realized plus unrealized';
    foot = '<span>peak ' + money(Math.max.apply(null, rows.map(function (q) { return q.v; })), 0) +
      '</span><span>trough ' + money(Math.min.apply(null, rows.map(function (q) {
        return q.v; })), 0) + '</span><span>' + money(D.book.realized, 0) + ' of it is banked</span>';
  }
  return block('Chart', sub, '<span class="seg">' + VIEWS.map(function (v) {
      return '<button data-view="' + v[0] + '" aria-selected="' + (S.view === v[0]) + '">' +
        v[1] + '</button>'; }).join('') + '</span>',
    '<div class="chart">' + body + '</div><div class="leg">' + foot + '</div>', true);
}

/* the two explanations belong with the volatility views, not on a tab of their own */
function signalBlocks() {
  var sig = (D.series.signal || []).filter(function (q) { return q.iv && q.iv < 0.4; });
  var q0 = (D.series.quarantine || [])[0] || {};
  return '<div class="grid2">' +
    block('What the number means', 'the whole strategy in four lines', '',
      '<div class="kv2" style="line-height:1.95">' +
      '<span>implied volatility</span><span>what the option market charges for movement</span>' +
      '<span>realized volatility</span><span>how much the index actually moved, 20 sessions</span>' +
      '<span>the premium</span><span>the gap between them — the only thing this desk trades</span>' +
      '<span>direction</span><span>never an input, at any point in the pipeline</span></div>') +
    block('Data quality', 'the desk marks its own bad data', '',
      '<div class="kv2" style="line-height:1.95">' +
      '<span>readings kept</span><span>' + sig.length + '</span>' +
      '<span>marks quarantined</span><span class="am">' + D.marks_quarantined + '</span>' +
      '<span>cause</span><span>' + E(q0.reason || '—') + '</span>' +
      '<span>integrity checks</span><span>' + (D.series.integrity || []).filter(function (x) {
        return x.ok; }).length + ' clean of ' + (D.series.integrity || []).length + '</span></div>' +
      '<p class="rnote" style="padding:0;margin-top:12px">After a close the feed reported the ' +
      'index at half its price. The desk flagged those marks itself and refused to trade on ' +
      'them; they stay in the store and out of every chart.</p>') +
    '</div>';
}



/* ---- workspace · positions ---------------------------------------------- */
function panePositions() {
  var rows = D.positions[S.pos] || [];
  var tabs = [['open', 'open', D.counts.structures_open],
              ['closed', 'closed', D.counts.structures_closed],
              ['unfilled', 'unfilled', D.counts.structures_unfilled]];
  var byId = {}; (D.trades || []).forEach(function (t) { byId[t.id] = t; });
  var head = S.pos === 'closed'
    ? '<tr><th></th><th>Structure</th><th>Under</th><th class="num">Credit</th>' +
      '<th class="num">Result</th><th class="num">Held</th><th>Window</th></tr>'
    : '<tr><th></th><th>Structure</th><th>Under</th><th class="num">Credit</th>' +
      '<th class="num">Worst case</th><th>Opened</th><th>Status</th></tr>';
  var body = rows.map(function (p) {
    var t = byId[p.id] || {}, opened = S.open['p' + p.id];
    var cells = S.pos === 'closed'
      ? '<td class="f">' + E(p.legs[0].symbol.slice(0, 3)) + '</td>' +
        '<td class="num d">' + money(p.credit) + '</td><td class="num">' + m(p.pnl, 0) + '</td>' +
        '<td class="num f">' + (t.hours == null ? '—' : t.hours + 'h') + '</td>' +
        '<td class="f">' + E(dm(p.opened)) + ' → ' + E(dm(p.closed)) + '</td>'
      : '<td class="f">' + E(p.legs[0].symbol.slice(0, 3)) + '</td>' +
        '<td class="num d">' + money(p.credit) + '</td>' +
        '<td class="num">' + usd(p.max_loss, 0) + '</td>' +
        '<td class="f">' + E(dm(p.opened)) + ' ' + E(hm(p.opened)) + 'Z</td>' +
        '<td class="f">' + E(p.status) + '</td>';
    var main = '<tr class="x" data-open="p' + p.id + '"><td class="f">' + (opened ? '▾' : '▸') +
      '</td><td>' + E(p.kind.replace(/_/g, ' ')) + '</td>' + cells + '</tr>';
    if (!opened) return main;
    var path = (D.series.manage || {})[p.id] || [];
    return main + '<tr class="det"><td colspan="7"><div class="detbox"><div class="kv2">' +
      '<span>structure id</span><span>' + E(p.id) + '</span>' +
      '<span>sleeve · quantity</span><span>' + E(p.sleeve) + ' · ' + p.qty + '</span>' +
      '<span>legs</span><span>' + p.legs.map(function (l) {
        return (l.qty > 0 ? '+' : '−') + Math.abs(l.qty) + ' ' + E(l.symbol) +
        (l.entry != null ? ' @ ' + l.entry : ''); }).join('<br>') + '</span>' +
      '<span>worst case</span><span>' + usd(p.max_loss, 0) + ', computed before the order</span>' +
      (path.length ? '<span>management</span><span>' + path.length + ' decisions · last: ' +
        E(path[path.length - 1].a) + ', ' + E(path[path.length - 1].w) + '</span>' : '') +
      '</div></div></td></tr>';
  }).join('');
  var wins = (D.trades || []).filter(function (t) { return t.pnl > 0; }).length;
  return     block('The book', D.counts.structures_total + ' structures · every worst case fixed at entry',
      '<span class="seg">' + tabs.map(function (t) {
        return '<button data-pos="' + t[0] + '" aria-selected="' + (S.pos === t[0]) + '">' +
          t[1] + ' ' + t[2] + '</button>'; }).join('') + '</span>',
      rows.length ? '<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table>'
        : '<div class="empty">nothing in this bucket</div>', true) +
    block('Exposure', 'what the book earns or loses when one thing moves', '',
      '<div class="big4">' +
        b4('Delta', money(D.greeks.delta), 'per $1 move in the index — near zero by design',
           sgn(D.greeks.delta)) +
        b4('Theta', money(D.greeks.theta), 'per day if nothing moves — this is the product',
           sgn(D.greeks.theta)) +
        b4('Vega', money(D.greeks.vega), 'per volatility point — short vol, as intended',
           sgn(D.greeks.vega)) +
        b4('Realized', money(D.book.realized, 0), wins + ' of ' + (D.trades || []).length +
           ' closed trades won', sgn(D.book.realized)) +
      '</div>');
}

/* ---- workspace · refusals ----------------------------------------------- */
function paneRules() {
  var KIND = { entry_refused: 'a rule refused it', derisk_mode: 'event window',
    no_candidate: 'nothing worth trading', entry_skipped_duplicate: 'already held',
    market_closed: 'market closed', desk_veto: 'desk vetoed', data_suspect: 'data suspect' };
  var bk = D.refusals.by_kind || {}, bg = D.refusals.by_gate || {};
  var defs = {}; (D.gate_defs || []).forEach(function (g) { defs[g.id] = g; });
  var mk = Math.max.apply(null, Object.keys(bk).map(function (k) { return bk[k]; }));
  var mg = Math.max.apply(null, Object.keys(bg).map(function (k) { return bg[k]; }));
  var stream = (D.series.refusals || []).slice().reverse()
    .filter(function (r) { return !S.gate || r.gate === S.gate; })
    .slice(0, 40).map(function (r, i) {
      var isGate = r.kind === 'entry_refused';
      var cls = isGate ? 'stop' : r.kind === 'no_candidate' ? 'skip' : '';
      var verdict = isGate ? 'refused' : r.kind === 'no_candidate' ? 'no candidate'
        : r.kind === 'derisk_mode' ? 'stood down' : r.kind.replace(/_/g, ' ');
      var open = S.open['r' + i], g = defs[r.gate];
      var main = '<tr class="x" data-open="r' + i + '">' +
        '<td class="f">' + E(dm(r.t)) + ' ' + E(hm(r.t)) + '</td>' +
        '<td><span class="vp ' + cls + '">' + E(verdict) + '</span></td>' +
        '<td class="d">' + E(r.gate ? (g || {}).label || r.gate : '—') + '</td>' +
        '<td class="w">' + E(r.reason) + '</td></tr>';
      if (!open) return main;
      return main + '<tr class="det"><td colspan="4"><div class="detbox"><div class="kv2">' +
        '<span>journal kind</span><span>' + E(r.kind) + '</span>' +
        '<span>gate</span><span>' + E(r.gate || 'none — the selector produced nothing') + '</span>' +
        (g ? '<span>what it enforces</span><span>' + E(g.what) + '</span>' +
             '<span>governed by</span><span>' + E((g.params || []).join(', ') || '—') + '</span>' : '') +
        '<span>full reason</span><span>' + E(r.reason) + '</span>' +
        (r.vrp != null ? '<span>vrp at the time</span><span>' + r.vrp + '</span>' : '') +
        '</div></div></td></tr>';
    }).join('');
  var bgg = D.refusals.by_gate || {}, evals = (D.series.gates || []).length, reached = {};
  (D.series.gates || []).forEach(function (row) {
    Object.keys(row.r || {}).forEach(function (g2) { reached[g2] = (reached[g2] || 0) + 1; });
  });
  var cards = (D.gate_defs || []).map(function (g2) {
    var stops = bgg[g2.id] || 0, on = S.open['g' + g2.id];
    return '<div class="gc' + (on ? ' on' : '') + '" data-open="g' + g2.id + '">' +
      '<div class="h"><span class="n">' + E(g2.label) + '</span>' +
      '<span class="vp ' + (stops ? 'stop' : 'pass') + '">' +
        (stops ? 'stopped ' + stops : 'never bound') + '</span></div>' +
      '<div class="d">' + E(g2.what) + '</div>' +
      '<div class="m">' + E(g2.id) + ' · reached on ' + (reached[g2.id] || 0) + ' of ' + evals +
      '</div>' + (on ? '<div class="more">governed by <b>' +
        E((g2.params || []).join(', ') || 'no parameter') + '</b><br>' +
        (stops ? 'it refused ' + stops + ' candidates — they are in the stream below'
               : 'it has never been the binding constraint on this account') + '</div>' : '') +
      '</div>';
  }).join('');
  return block('The rule wall', evals + ' evaluations · 12 gates · plain Python, before any order',
      '<span class="lab">click a gate for its parameters</span>',
      '<div class="gcards">' + cards + '</div>') +
    '<div class="grid2 narrow">' +
      block('Gate ledger', 'click a rule to filter the stream',
        S.gate ? '<span class="seg"><button data-gate="">clear</button></span>' : '',
        '<span class="lab" style="display:block;margin-bottom:9px">why a trade did not happen</span>' +
        '<div class="bars">' + Object.keys(bk).map(function (k) {
          return bar(KIND[k] || k, bk[k], mk, ''); }).join('') + '</div>' +
        '<span class="lab" style="display:block;margin:17px 0 9px">which rule stopped it</span>' +
        '<div class="bars">' + Object.keys(bg).map(function (k) {
          return bar((defs[k] || {}).label || k, bg[k], mg, k); }).join('') + '</div>') +
      block('The rejection stream', (S.gate ? 'filtered to ' +
        ((defs[S.gate] || {}).label || S.gate) + ' · ' : '') +
        'every candidate the desk declined, with the rule that stopped it',
        '<span class="lab">click a row for the record</span>',
        '<table><thead><tr><th>Time</th><th>Verdict</th><th>Gate</th><th>Finding</th></tr></thead>' +
        '<tbody>' + (stream || '<tr><td colspan="4" class="empty">nothing matches</td></tr>') +
        '</tbody></table>', true) +
    '</div>';
}


/* ---- workspace · proof -------------------------------------------------- */
function paneProof() {

function au(l, used, limit) {

/* ---- audit log ---------------------------------------------------------- */
function logRows() {
  var s = D.series, out = [];
  (s.refusals || []).forEach(function (r) {
    if (r.kind === 'market_closed') return;
    out.push({ t: r.t, tag: r.gate || r.kind, id: 'refused', text: r.reason, hot: 1, grp: 'refused' });
  });
  (D.decisions || []).forEach(function (r) {
    if (r.kind.indexOf('order_') !== 0) return;
    out.push({ t: r.t, tag: r.kind.replace('order_', ''), id: r.id,
               text: r.reason || r.action || '', good: 1, grp: 'orders' });
  });
  (s.desk || []).forEach(function (mm) {
    out.push({ t: mm.t, tag: mm.veto ? 'veto' : mm.dis ? 'disagreed' : 'agreed',
               id: mm.a + ' / ' + mm.b, text: mm.why, hot: mm.veto, grp: 'desk' });
  });
  (s.gates || []).forEach(function (gt) {
    out.push({ t: gt.t, tag: gt.passed ? 'passed' : 'stopped', id: gt.sid,
               text: gt.kind + ' ×' + gt.qty + (gt.fails.length
                 ? ' — ' + gt.fails[0].gate + ': ' + gt.fails[0].reason : ' — all gates clear'),
               hot: !gt.passed, good: gt.passed, grp: 'gates', trace: gt.t });
  });
  out.sort(function (a, b) { return a.t < b.t ? 1 : -1; });
  return out;
}
function drawLog() {
  var rows = logRows(), counts = { all: rows.length };
  ['refused', 'gates', 'orders', 'desk'].forEach(function (g) {
    counts[g] = rows.filter(function (r) { return r.grp === g; }).length; });
  document.getElementById('logchips').innerHTML =
    ['all', 'refused', 'gates', 'orders', 'desk'].map(function (g) {
      return '<button data-log="' + g + '" aria-pressed="' + (S.logf === g) + '">' + g + ' ' +
        counts[g] + '</button>'; }).join('');
  var show = rows.filter(function (r) { return S.logf === 'all' || r.grp === S.logf; }).slice(0, 50);
  document.getElementById('log').innerHTML = show.map(function (r) {
    return '<div class="le' + (r.hot ? ' hot' : r.good ? ' good' : '') + '"' +
      (r.trace ? ' data-trace="' + E(r.trace) + '"' : '') + '>' +
      '<div class="r1"><span class="tag">' + E(r.tag) + '</span><span class="id">' + E(r.id) +
      '</span><span class="tm">' + E(dm(r.t)) + ' ' + E(hm(r.t)) + '</span></div>' +
      '<div class="r2">' + E(r.text) + '</div></div>';
  }).join('') || '<div class="empty">nothing in this filter</div>';
}

/* ---- decision trace ----------------------------------------------------- */
function openTrace(t) {
  var s = D.series;
  var gt = (s.gates || []).filter(function (g) { return g.t === t; })[0];
  if (!gt) return;
  var sig = nearest(s.signal || [], gt.t) || {}, desk = nearest(s.desk || [], gt.t) || {};
  var defs = {}; (D.gate_defs || []).forEach(function (g) { defs[g.id] = g; });
  var fail = gt.fails[0];
  var gateLine = (D.gate_defs || []).map(function (g) {
    var st = gt.r[g.id];
    var col = st === 0 ? '#F2C14E' : st === 1 ? '#5CCB8E' : '#3A3A38';
    return '<span style="color:' + col + '">' + (st === 1 ? '✓' : st === 0 ? '✗' : '–') + ' ' +
      E(g.label) + '</span>';
  }).join('&nbsp;&nbsp;&nbsp;');
  var steps = [
    ['scan', E(D.params.universe.primary) + ' ' + Number(sig.spot).toFixed(2) +
      ' · chain snapshot stored for replay', ''],
    ['measure', 'iv ' + pct(sig.iv) + ' · rv ' + pct(sig.rv) + ' · premium ' +
      sg2((sig.iv - sig.rv) * 100) + ' pts · vrp ' + Number(sig.vrp).toFixed(2), ''],
    ['classify', sig.vrp >= D.params.regime.vrp_rich_threshold ? 'SELL_VOL'
      : sig.vrp < D.params.regime.vrp_cheap_threshold ? 'BUY_VOL' : 'NEUTRAL',
      'Two model roles read the tape independently: ' + E(desk.a || '?') + ' and ' +
      E(desk.b || '?') + (desk.dis ? ' — they disagreed, so size was halved.' : ' — they agreed.') +
      (desk.veto ? ' The vetoer blocked the trade.' : '')],
    ['build', E(gt.kind) + ' ×' + gt.qty + (gt.wc ? ' · worst case ' + usd(-gt.wc.pnl, 0) +
      ' at ' + (gt.wc.spot_rel * 100).toFixed(0) + '% of spot (' + E(gt.wc.scenario) + ')' : ''), ''],
    ['gate', gateLine, '']
  ];
  document.getElementById('trace-sheet').innerHTML =
    '<span class="x" id="trace-x">close · esc</span>' +
    '<h3>' + E(D.params.universe.primary) + '<span class="st">' +
      (gt.passed ? 'passed' : 'refused') + ' · ' + E(dm(gt.t)) + ' ' + E(hm(gt.t)) + 'Z · ' +
      E(gt.sid) + '</span></h3>' +
    '<p class="lede">' + (fail
      ? 'The wall stopped this structure at <b>' + E((defs[fail.gate] || {}).label || fail.gate) +
        '</b>. ' + E(fail.reason) + '.'
      : 'Every gate cleared and the order was submitted.') + '</p>' +
    steps.map(function (st, i) {
      var isFail = st[0] === 'gate' && fail;
      return '<div class="step' + (isFail ? ' fail' : '') + '"><span class="n">' + (i + 1) +
        '</span><div class="b"><span class="lab">' + st[0] + '</span>' +
        '<div class="val">' + st[1] + '</div>' +
        (st[2] ? '<div class="why">' + st[2] + '</div>' : '') +
        (isFail ? '<div class="box"><span class="lab">' +
          E((defs[fail.gate] || {}).label || fail.gate) + ' failed</span>' +
          '<div class="why" style="color:#F4F4F1;margin-top:5px">' + E(fail.reason) + '</div>' +
          '<div class="why" style="margin-top:6px">' + E((defs[fail.gate] || {}).what || '') +
          '</div></div>' : '') + '</div></div>';
    }).join('') +
    '<div class="step"><span class="n">6</span><div class="b"><span class="lab">outcome</span>' +
    '<div class="val ' + (gt.passed ? 'up' : 'am') + '">' +
      (gt.passed ? 'ORDER SUBMITTED' : 'REFUSED — no order was sent') + '</div>' +
    '<div class="why">This trace is rebuilt from the journal, not written for the page. The ' +
    'snapshot the desk saw at ' + E(hm(gt.t)) + 'Z is stored, so this tick can be replayed and ' +
    'must produce the same result.</div></div></div>';
  document.getElementById('trace').classList.add('on');
  document.getElementById('trace-x').onclick = closeTrace;
}
function closeTrace() { document.getElementById('trace').classList.remove('on'); }

/* ---- broker pulse --------------------------------------------------------
   tools/pulse.py writes live.json every few seconds: the exchange clock, the
   account, the last print on the primary underlying. It only ever GETs. This
   updates four nodes in place — redrawing the console every three seconds
   would make it unusable, and there is nothing else that needs redrawing. */
var PULSE_MS = 2500;
function pollPulse() {
  fetch('live.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (x) { PULSE = x; PULSE_AT = Date.now(); pulseClock(); })
    .catch(function () { /* no pulse process running: the zone says so */ });
}
function pulseClock() {
  var dot = document.getElementById('pdot'), v = document.getElementById('pv'),
      mk = document.getElementById('pmkt');
  if (!dot || !v || !mk) return;
  if (!PULSE) {
    dot.className = 'pdot off';
    v.textContent = '—';
    mk.textContent = EMBEDDED
      ? ' · no reading published with this page'
      : ' · no live.json — run ops\\pulse.ps1 for a live account read';
    return;
  }
  /* Served directly the console polls and the age is the age of the poll.
     Embedded, the reading travelled with the page: age it from its own
     timestamp and say so, rather than implying a live connection. */
  var age = EMBEDDED
    ? (Date.now() - Date.parse(PULSE.t)) / 1000
    : (Date.now() - PULSE_AT) / 1000;
  dot.className = 'pdot' + (age > 20 ? ' off' : '');
  var a = PULSE.account || {};
  v.textContent = a.equity != null ? usd(a.equity) : '—';

  var m = PULSE.market || {}, lt = PULSE.last_trade || {}, state = '';
  if (m.is_open === true) {
    state = ' · market open' + (m.next_close ? ' · closes in ' + until(m.next_close) : '');
  } else if (m.is_open === false) {
    state = ' · market closed' + (m.next_open ? ' · opens in ' + until(m.next_open) : '');
  }
  var ago = ' · ' + (age < 90 ? Math.round(age) + 's' : Math.round(age / 60) + 'm') +
           (EMBEDDED ? ' old, published with this page' : ' ago');
  var print = lt.price ? ' · last print ' + usd(lt.price) + ' at ' + hm(lt.at) + 'Z' : '';
  var seqs = ' · poll ' + PULSE.seq;
  /* Measure rather than guess: write the fullest tail, and drop one fact at a
     time until the bar stops overflowing. Guessing by viewport width was wrong
     at every width I did not test. */
  var levels = [state + print + seqs + ago, state + seqs + ago, state + ago,
                ' · market ' + (m.is_open ? 'open' : 'closed') + ago, ago];
  var bar = document.getElementById('status');
  for (var li = 0; li < levels.length; li++) {
    mk.textContent = levels[li];
    if (bar.scrollWidth <= bar.clientWidth + 1) break;
  }

  /* the account cell shows the freshest reading there is, and says which */
  var eq = document.getElementById('kpi-eq');
  if (eq && a.equity != null) {
    eq.querySelector('.v').innerHTML = usd(a.equity, 0);
    eq.querySelector('.s').innerHTML = 'Alpaca paper ' + E(D.account) + ' · ' +
      (EMBEDDED ? 'read ' + Math.round(age) + 's before this page was served'
                : 'polled ' + Math.round(age) + 's ago');
  }
}
/* a plain countdown to an ISO instant, ticking locally between polls */
function until(iso) {
  /* the clock endpoint returns exchange-local instants with their offset;
     parse them as they came rather than assuming UTC */
  var ms = Date.parse(iso) - Date.now();
  if (isNaN(ms)) return '—';
  if (ms < 0) return 'now';
  var h = Math.floor(ms / 3.6e6), mi = Math.floor((ms % 3.6e6) / 6e4),
      se = Math.floor((ms % 6e4) / 1000);
  return (h ? h + 'h ' : '') + (h || mi ? mi + 'm ' : '') + se + 's';
}

/* ---- pointer readout -----------------------------------------------------
   Hovering a chart is how anyone actually reads one: which tick is this, and
   what was every series worth there. The rule and the dots are already in the
   SVG; this only moves them and fills the box. */
function chartMove(ev) {
  var svg = ev.target.closest ? ev.target.closest('svg[data-ch]') : null;
  if (!svg) return chartLeave();
  var c = CHARTS[svg.dataset.ch];
  if (!c) return;
  var r = svg.getBoundingClientRect();
  var vx = (ev.clientX - r.left) / r.width * c.W;
  var span = c.W - c.P.l - c.P.r;
  var i = Math.round((vx - c.P.l) / span * (c.n - 1));
  if (i < 0) i = 0;
  if (i > c.n - 1) i = c.n - 1;
  var X = c.P.l + (i / Math.max(1, c.n - 1)) * span;
  var Y = function (v) { return c.P.t + (1 - (v - c.lo) / (c.hi - c.lo)) * (c.H - c.P.t - c.P.b); };

  var g = svg.querySelector('.xh');
  g.style.display = '';
  g.querySelector('.xhl').setAttribute('x1', X);
  g.querySelector('.xhl').setAttribute('x2', X);
  var dots = g.querySelectorAll('.xhd'), k = 0, rows = [];
  c.series.forEach(function (sr, si) {
    if (sr.hidden) return;
    var v = sr.pts[i], d = dots[k++];
    if (d) {
      if (v == null) { d.setAttribute('cx', -99); d.setAttribute('cy', -99); }
      else { d.setAttribute('cx', X.toFixed(1)); d.setAttribute('cy', Y(v).toFixed(1)); }
    }
    rows.push('<span><i style="background:' + sr.color + '"></i>' +
      (sr.name ? E(sr.name) + ' ' : '') + '<b>' + (v == null ? '—' : E(c.fmt(v))) + '</b></span>');
  });

  var tip = document.getElementById('tip');
  tip.innerHTML = '<span class="t">' + (c.times && c.times[i]
    ? E(dm(c.times[i])) + ' ' + E(hm(c.times[i])) + 'Z · tick ' + (i + 1) + ' of ' + c.n
    : 'tick ' + (i + 1) + ' of ' + c.n) + '</span>' + rows.join('');
  tip.style.display = 'block';
  var box = tip.getBoundingClientRect();
  var px = r.left + (X / c.W) * r.width + 14;
  if (px + box.width > innerWidth - 10) px = r.left + (X / c.W) * r.width - box.width - 14;
  tip.style.left = Math.max(8, px) + 'px';
  tip.style.top = Math.max(8, Math.min(innerHeight - box.height - 8, ev.clientY - box.height / 2)) + 'px';
}
function chartLeave() {
  document.getElementById('tip').style.display = 'none';
  Array.prototype.forEach.call(document.querySelectorAll('svg[data-ch] .xh'), function (g) {
    g.style.display = 'none';
  });
}
document.addEventListener('mousemove', function (e) {
  if (e.target.closest && e.target.closest('svg[data-ch]')) chartMove(e);
  else chartLeave();
});

/* ---- wiring ------------------------------------------------------------- */
/* the workspace is addressable: a link to #refusals opens on that workspace,
   which is how anyone shares what they are looking at */
function setTab(id) {
  if (!PANES[id]) return;
  S.tab = id;
  try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; }
  drawTabs(); drawPane();
}
var PANES = { desk: paneDesk, book: panePositions, rules: paneRules, proof: paneProof };
function drawPane() {
  document.getElementById('pane').innerHTML = (PANES[S.tab] || paneDesk)();
  document.getElementById('pane').scrollTop = 0;
}
function renderAll() {
  drawStatus(); drawKpi(); drawLeft(); drawTabs(); drawPane(); drawRight();
  drawLog(); drawFoot();
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-tab]');
  if (t) { setTab(t.dataset.tab); return; }
  var sy = e.target.closest('[data-sym]');
  if (sy) { S.sym = sy.dataset.sym; setTab('desk'); drawLeft(); return; }
  var b = e.target.closest('[data-book]');
  if (b) { S.books[b.dataset.book] = !S.books[b.dataset.book]; drawLeft(); drawPane(); return; }
  var p = e.target.closest('[data-pos]');
  if (p) { S.pos = p.dataset.pos; drawPane(); return; }
  var vw = e.target.closest('[data-view]');
  if (vw) { S.view = vw.dataset.view; setTab('desk'); return; }
  var g = e.target.closest('[data-gate]');
  if (g) { S.gate = g.dataset.gate || null; drawPane(); return; }
  var o = e.target.closest('[data-open]');
  if (o) { S.open[o.dataset.open] = !S.open[o.dataset.open]; drawPane(); return; }
  var l = e.target.closest('[data-log]');
  if (l) { S.logf = l.dataset.log; drawLog(); return; }
  if (e.target.id === 'reload') { refresh(true); return; }
  var tr = e.target.closest('[data-trace]');
  if (tr) { openTrace(tr.dataset.trace); return; }
  if (e.target.id === 'trace') closeTrace();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeTrace(); return; }
  var i = ['1', '2', '3', '4'].indexOf(e.key);
  if (i >= 0 && TABS[i]) setTab(TABS[i][0]);
});

/* ---- boot --------------------------------------------------------------- */
function boot(d) {
  D = d;
  var h = (location.hash || '').replace('#', '');
  if (PANES[h]) S.tab = h;
  try { renderAll(); }
  catch (err) {
    document.getElementById('pane').innerHTML =
      '<div class="empty">This console failed to render: ' + E(err.message) + '</div>';
    throw err;
  }
}
/* Poll the export rather than the clock: a 304 costs nothing and the tick only
   lands every fifteen minutes, so this is a few hundred bytes an hour until
   something actually changes. */
var POLL_MS = 60000;
function refresh(manual) {
  if (EMBEDDED) {
    /* no path to fetch from inside the component; reruning the host is the
       only way to get new bytes, and only a person should decide to do it */
    if (manual) { try { top.location.reload(); } catch (e) { location.reload(); } }
    return;
  }
  var btn = document.getElementById('reload');
  if (btn) btn.classList.add('busy');
  fetch('data.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (fresh) {
      LOADED = Date.now();
      var changed = !D || fresh.generated_utc !== D.generated_utc;
      if (changed) {
        var keep = document.getElementById('pane').scrollTop;
        D = fresh;
        renderAll();
        document.getElementById('pane').scrollTop = keep;
      }
      ageClock();
      if (btn) btn.classList.remove('busy');
    })
    .catch(function (e) {
      if (btn) btn.classList.remove('busy');
      var a = document.getElementById('age');
      if (a) { a.textContent = 'offline'; a.className = 'age stale'; }
    });
}

if (window.__DATA__) { EMBEDDED = true; LOADED = Date.now(); boot(window.__DATA__); }
else {
  fetch('data.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (x) { LOADED = Date.now(); boot(x); })
    .catch(function (e) {
      document.getElementById('boot').textContent =
        'data.json could not be loaded (' + e.message + '). Run: python tools/site_data.py';
    });
}
setInterval(function () { if (AUTO) refresh(false); }, POLL_MS);
setInterval(function () { ageClock(); tickClock(); pulseClock(); }, 1000);
if (window.__LIVE__) { PULSE = window.__LIVE__; PULSE_AT = Date.now(); }
if (!EMBEDDED) { setInterval(pollPulse, PULSE_MS); pollPulse(); }
})();
</script>
</body>
</html>
